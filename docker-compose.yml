# Production stack. Run with: docker compose --env-file .env.production ...
# web is the only public ingress (host ${EXAM_PORT:-80}): one nginx serving
# the static SPA and routing /api/** to app (:3000, API). app and db are
# internal services on exam-net.
# Pinned so prod never shares the directory-derived `exam` project with the
# dev stack (docker-compose.dev.yml, `exam-dev`) when run from one checkout.
name: exam-prod
services:
  app:
    image: ${EXAM_IMAGE:?EXAM_IMAGE is required (node scripts/init-production-env.mjs)}
    expose:
      - "3000"
    environment:
      # Runtime settings are forwarded, never defaulted, here: an empty
      # value resolves to the semantic default in apps/api/src/config/settings.ts.
      DATABASE_URL: postgresql://${POSTGRES_USER:-exam}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-exam}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (node scripts/init-production-env.mjs)}
      NODE_ENV: production
      APP_MODE: production
      APP_PORT: 3000
      HOST: 0.0.0.0
      # Canonical public origin (nginx owns :80); remapped EXAM_PORT or LAN
      # access must set both explicitly.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-singleTenant}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_MODE: ${REDIS_MODE:-}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-}
      REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-}
      REDIS_STARTUP_TIMEOUT_MS: ${REDIS_STARTUP_TIMEOUT_MS:-}
      LAUNCHPAD_SETUP_TOKEN: ${LAUNCHPAD_SETUP_TOKEN:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-}
      EMAIL_FAKE_MODE: ${EMAIL_FAKE_MODE:-}
      EMAIL_FAKE_DELAY_MS: ${EMAIL_FAKE_DELAY_MS:-}
      # Test-only fake-sender witness; empty in real deployments.
      EMAIL_FAKE_SEND_ENTERED_FILE: ${EMAIL_FAKE_SEND_ENTERED_FILE:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-}
      EMAIL_RETRY_BASE_SECONDS: ${EMAIL_RETRY_BASE_SECONDS:-}
      EMAIL_WORKER_POLL_INTERVAL_MS: ${EMAIL_WORKER_POLL_INTERVAL_MS:-}
      EMAIL_WORKER_BATCH_SIZE: ${EMAIL_WORKER_BATCH_SIZE:-}
      EMAIL_WORKER_LOCK_TIMEOUT_MS: ${EMAIL_WORKER_LOCK_TIMEOUT_MS:-}
      EMAIL_WORKER_HEARTBEAT_STALE_MS: ${EMAIL_WORKER_HEARTBEAT_STALE_MS:-}
      EMAIL_WORKER_SHUTDOWN_TIMEOUT_MS: ${EMAIL_WORKER_SHUTDOWN_TIMEOUT_MS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-}
      SMTP_TLS_SERVERNAME: ${SMTP_TLS_SERVERNAME:-}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-}
      SMTP_GREETING_TIMEOUT_MS: ${SMTP_GREETING_TIMEOUT_MS:-}
      SMTP_SOCKET_TIMEOUT_MS: ${SMTP_SOCKET_TIMEOUT_MS:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-}
      # Bundled-topology default: the web nginx edge is the only public
      # ingress, so the trust set is the stack's own bridge subnet. Honest
      # scope: EVERY exam-net peer is trusted (web, db, redis, any future
      # service) — not only the web→app hop; browser-supplied XFF never
      # reaches the app because the edge REPLACES the header (runbook §2).
      # INVARIANT: this fallback and networks.exam-net.ipam below must
      # derive from the SAME EXAM_DOCKER_SUBNET default — pinned together by
      # runtimeConfig.test.ts ("bundled production proxy-trust baseline").
      # Override only for an EXTERNAL proxy topology (runbook §2).
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-${EXAM_DOCKER_SUBNET:-172.28.0.0/24}}
      HEARTBEAT_SCAN_INTERVAL_MS: ${HEARTBEAT_SCAN_INTERVAL_MS:-}
      HEARTBEAT_TIMEOUT_MS: ${HEARTBEAT_TIMEOUT_MS:-}
      # Unset → defaults to HEARTBEAT_SCAN_INTERVAL_MS inside the app.
      DEADLINE_SCAN_INTERVAL_MS: ${DEADLINE_SCAN_INTERVAL_MS:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /api/ready (DB-aware readiness), never /api/health (liveness).
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - exam-net
    restart: unless-stopped
    # INVARIANT: must dominate the app's serial graceful-shutdown worst case,
    # or SIGTERM degrades to SIGKILL (exit 137) mid email drain.
    stop_grace_period: 45s

  web:
    # ONLY public ingress (#585): one nginx serving the static SPA and
    # routing /api/** -> app:3000. The config (deploy/nginx/web.conf) is
    # BAKED into the image. HTTPS is a commented template in web.conf —
    # activation mounts certs plus an overriding conf (runtime mount), never
    # an edit to the already-pulled image.
    image: ${EXAM_WEB_IMAGE:?EXAM_WEB_IMAGE is required (node scripts/init-production-env.mjs)}
    ports:
      - "${EXAM_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - exam-net
    restart: unless-stopped

  db:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-exam}
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${APP_TIMEZONE:-Asia/Shanghai}
    volumes:
      - ${EXAM_DATA_ROOT:-./data}/postgres:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "${POSTGRES_USER:-exam}",
          "-d",
          "${POSTGRES_DB:-exam}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exam-net
    restart: unless-stopped

  # `$$` escapes interpolation: refuses to start without REDIS_PASSWORD and
  # runs --requirepass.
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    command:
      - sh
      - -ec
      - |
        : "$${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
        exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${EXAM_DATA_ROOT:-./data}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exam-net
    restart: unless-stopped

  # Email delivery runs in-process inside the app container (durable
  # PostgreSQL outbox); the app container is the sole migration owner.

networks:
  exam-net:
    driver: bridge
    ipam:
      config:
        # Single topology authority: EXAM_DOCKER_SUBNET names the bridge
        # subnet AND feeds the bundled TRUSTED_PROXY_CIDRS fallback above,
        # so moving the subnet cannot leave the trust default stale.
        # Collision semantics (accurate form): overlap with another Docker
        # network fails at `up` ("Pool overlaps..."); overlap with a host
        # LAN/VPN route may succeed and then silently break container
        # routing — choose a free subnet via EXAM_DOCKER_SUBNET in
        # .env.production (runbook §2).
        - subnet: ${EXAM_DOCKER_SUBNET:-172.28.0.0/24}
