# Sole operator entry point (deployment-topology-contract.mjs enforces this).
# Run with the deployment env file: docker compose --env-file .env.deploy ...
# (created by node scripts/generate-env.mjs; the dev .env is never read when
# --env-file is passed). Authoritative state is the ./data bind mounts — see
# docs/deployment/backup-and-recovery.md.
services:
  app:
    # Operator path: prebuilt semantic image, pinned by EXAM_IMAGE in the
    # deployment env file (generate-env.mjs derives the default from
    # .release-version — the single version authority). Contributors / PR
    # acceptance merge docker-compose.build.yml to build THIS checkout
    # instead (pull_policy: build — a cached registry image can never fake
    # source acceptance).
    image: ${EXAM_IMAGE:?EXAM_IMAGE is required (node scripts/generate-env.mjs)}
    ports:
      - "${EXAM_PORT:-3000}:3000"
    environment:
      # Application runtime settings are FORWARDED, not defaulted, here:
      # an empty `${KEY:-}` value reaches the app as "" and resolves to the
      # semantic default defined once in apps/api/src/config/settings.ts
      # (enforced by scripts/repository-contract/config-contract.mjs — a
      # literal fallback in this file may only mirror that same default).
      # Exceptions: APP_TIMEZONE (also drives the db service PGTZ literal)
      # and DEPLOYMENT_MODE keep explicit, parity-guarded literals.
      DATABASE_URL: postgresql://${POSTGRES_USER:-exam}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-exam}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (node scripts/generate-env.mjs)}
      NODE_ENV: production
      APP_MODE: production
      APP_PORT: 3000
      HOST: 0.0.0.0
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${EXAM_PORT:-3000}}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost:${EXAM_PORT:-3000}}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-singleTenant}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_MODE: ${REDIS_MODE:-}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-}
      REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-}
      REDIS_STARTUP_TIMEOUT_MS: ${REDIS_STARTUP_TIMEOUT_MS:-}
      LAUNCHPAD_SETUP_TOKEN: ${LAUNCHPAD_SETUP_TOKEN:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-}
      EMAIL_FAKE_MODE: ${EMAIL_FAKE_MODE:-}
      EMAIL_FAKE_DELAY_MS: ${EMAIL_FAKE_DELAY_MS:-}
      # Test/rehearsal-only fake-sender witness (#482): empty in any real
      # deployment; set by deployment tests to observe fake-send entry.
      EMAIL_FAKE_SEND_ENTERED_FILE: ${EMAIL_FAKE_SEND_ENTERED_FILE:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-}
      EMAIL_RETRY_BASE_SECONDS: ${EMAIL_RETRY_BASE_SECONDS:-}
      EMAIL_WORKER_POLL_INTERVAL_MS: ${EMAIL_WORKER_POLL_INTERVAL_MS:-}
      EMAIL_WORKER_BATCH_SIZE: ${EMAIL_WORKER_BATCH_SIZE:-}
      EMAIL_WORKER_LOCK_TIMEOUT_MS: ${EMAIL_WORKER_LOCK_TIMEOUT_MS:-}
      EMAIL_WORKER_HEARTBEAT_STALE_MS: ${EMAIL_WORKER_HEARTBEAT_STALE_MS:-}
      EMAIL_WORKER_SHUTDOWN_TIMEOUT_MS: ${EMAIL_WORKER_SHUTDOWN_TIMEOUT_MS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-}
      SMTP_TLS_SERVERNAME: ${SMTP_TLS_SERVERNAME:-}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-}
      SMTP_GREETING_TIMEOUT_MS: ${SMTP_GREETING_TIMEOUT_MS:-}
      SMTP_SOCKET_TIMEOUT_MS: ${SMTP_SOCKET_TIMEOUT_MS:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Tunable runtime knobs (defaults live in settings.ts). Forwarded so
      # operators can override them via .env.deploy without editing Compose.
      RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-}
      FEATURE_RESTORE_FRONTEND: ${FEATURE_RESTORE_FRONTEND:-}
      FEATURE_MANUAL_EXAM_OPEN_CLOSE: ${FEATURE_MANUAL_EXAM_OPEN_CLOSE:-}
      FEATURE_LIVE_SCORE_LIST: ${FEATURE_LIVE_SCORE_LIST:-}
      HEARTBEAT_SCAN_INTERVAL_MS: ${HEARTBEAT_SCAN_INTERVAL_MS:-}
      HEARTBEAT_TIMEOUT_MS: ${HEARTBEAT_TIMEOUT_MS:-}
      # Unset → defaults to HEARTBEAT_SCAN_INTERVAL_MS inside the app.
      DEADLINE_SCAN_INTERVAL_MS: ${DEADLINE_SCAN_INTERVAL_MS:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Proves the API and the SPA are both reachable, not just the backend.
      test:
        [
          "CMD",
          "node",
          "-e",
          "Promise.all([fetch('http://127.0.0.1:3000/api/health'), fetch('http://127.0.0.1:3000/')]).then(([api, web]) => { const ok = api.ok && (web.headers.get('content-type') || '').includes('text/html'); process.exit(ok ? 0 : 1) }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - exam-net
    restart: unless-stopped
    # INVARIANT (#351 shutdown budget contract): stop_grace_period MUST
    # dominate the app's whole graceful-shutdown worst case — email loop
    # drain (EMAIL_WORKER_SHUTDOWN_TIMEOUT_MS, default 8s) + audit drain
    # (AUDIT_DRAIN_TIMEOUT_MS, 10s) + DB pool close (10s) + bounded exit
    # assist (BOUNDED_EXIT_ASSIST_MS, 2s) = 30s — or a stuck in-flight
    # email send turns SIGTERM into SIGKILL (exit 137). Keep the margin
    # when changing any term; enforced by
    # scripts/repository-contract/deployment-topology-contract.mjs.
    stop_grace_period: 45s

  db:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-exam}
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${APP_TIMEZONE:-Asia/Shanghai}
    volumes:
      - ${EXAM_DATA_ROOT:-./data}/postgres:/var/lib/postgresql
      # Inert unless PITR is enabled via scripts/backup/postgres-enable-pitr.sh.
      - ${EXAM_WAL_ARCHIVE_HOST_PATH:-${EXAM_DATA_ROOT:-./data}/wal-archive}:/wal-archive
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "${POSTGRES_USER:-exam}",
          "-d",
          "${POSTGRES_DB:-exam}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exam-net
    restart: unless-stopped

  # `$$` escapes Compose interpolation — the startup guard requires a
  # password at container runtime and the server runs with --requirepass.
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    command:
      - sh
      - -ec
      - |
        : "$${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
        exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${EXAM_DATA_ROOT:-./data}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exam-net
    restart: unless-stopped

  # Outbox delivery (#320 CONVERGE): the email outbox loop runs in-process
  # inside the app container (plugins/emailOutboxLoop.ts) — same PostgreSQL
  # semantics as the former dedicated worker (durable outbox, SKIP LOCKED,
  # retry/backoff, lock-timeout recovery, at-least-once). The standalone
  # worker entrypoint (`worker:email`) remains available as an escape hatch.
  # The app's EMAIL_* environment variables configure the loop's sender; the
  # app container is the sole migration owner (see ADR-011 §8.6/#320).

networks:
  exam-net:
    driver: bridge
