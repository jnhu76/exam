# Production Compose contract (P7-C1: portable single-node deployment).
#
# Portable-deployment invariants enforced here and by the
# scripts/repository-contract/* guards:
#
#   - IMAGE-ONLY runtime. The app + email-worker services consume a prebuilt
#     image referenced by ${EXAM_IMAGE} (required). There is NO source-build
#     path in this file: a bare `docker compose up -d` never rebuilds "whatever
#     source is checked out today". Local source builds use the
#     docker-compose.build.yml override:
#         docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#     (P7-C1 C1.2: reproducible application/image contract.)
#
#   - CANONICAL PERSISTENT DATA ROOT. PostgreSQL durable state lives at an
#     operator-visible bind mount `${EXAM_DATA_ROOT:-./data}/postgres`, NOT a
#     Docker named volume. This is the exact-history relocation root:
#     `./data/` + this compose + a compatible image + `.env` = the same Exam
#     deployment on any clean host via the ordinary `docker compose up -d`
#     path (P7-C1 C1.1). Deleting `${EXAM_DATA_ROOT}/postgres` deletes
#     authoritative Exam state. `docker compose down` preserves it; `down -v`
#     does NOT remove bind-mounted host directories (it only removes named
#     volumes, of which there are none here) — `rm -rf ${EXAM_DATA_ROOT}` is
#     the destructive action.
#
# Security invariants (unchanged from P6):
#
#   - POSTGRES_PASSWORD is REQUIRED (no functional fallback). The bundled
#     production Compose must never accept a default database credential.
#     See P6-007 in docs/audits/P6-MVP-READY-REALITY-AUDIT.md.
#   - JWT_SECRET is REQUIRED for the API and the worker.
#   - PUBLIC_WEB_ORIGIN and CORS_ORIGIN are REQUIRED for the API and the
#     worker (the worker's shared runtime-config loader validates both).
#   - The email-worker depends on app: service_healthy so its self-migrate
#     call occurs strictly AFTER the app container has completed migrations
#     and become healthy. The drizzle migration journal tracks state; it is
#     NOT a concurrency lock (P6-009).
#   - Redis is an OPTIONAL profile (`--profile redis` /
#     COMPOSE_PROFILES=redis) and stays OPTIONAL at Compose parse time: a
#     bare `docker compose up` needs no Redis configuration. When the
#     profile IS enabled it MUST be authenticated: the redis container
#     refuses to start without REDIS_PASSWORD (startup guard) and the
#     server runs with `requirepass` (P7 review P1-1 — Redis now owns the
#     shared rate-limit state, so an open instance is not acceptable). The
#     API reads REDIS_URL; when the profile is enabled the operator must set
#     it to the authenticated URL, e.g. redis://:<REDIS_PASSWORD>@redis:6379.
#     See docs/deployment/mvp-deployment-runbook.md §10.
services:
  app:
    image: ${EXAM_IMAGE:?EXAM_IMAGE is required — build/tag a production image and set EXAM_IMAGE (see docker-compose.build.yml for local source builds)}
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-exam}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for production}@db:5432/${POSTGRES_DB:-exam}
      # Redis is optional in the implemented MVP (ADR-001), but it owns the
      # shared rate-limit state when enabled (P7). The default empty value
      # disables Redis; when the optional `redis` profile is enabled, set
      # REDIS_URL to the AUTHENTICATED URL (the redis service requires
      # REDIS_PASSWORD; use redis://:<REDIS_PASSWORD>@redis:6379).
      # REDIS_MODE (off|optional|required) defaults to "optional" when
      # REDIS_URL is set (P7).
      REDIS_URL: ${REDIS_URL:-}
      REDIS_MODE: ${REDIS_MODE:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required for production}
      NODE_ENV: production
      APP_MODE: production
      APP_PORT: 3000
      HOST: 0.0.0.0
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required for production}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:?PUBLIC_WEB_ORIGIN is required for production}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-singleTenant}
      # ADR-006: runtime timezone (display/log/diagnostics only; does not
      # change business-time comparison semantics).
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - exam-net
    restart: unless-stopped

  db:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exam}
      # P6-007: the database superuser password is REQUIRED for production.
      # The bundled production Compose must never accept a default
      # credential. The same required value is composed into the API and
      # worker DATABASE_URL above. Note: if an existing pgdata volume was
      # initialized with a different password, the operator must either
      # supply that password here or recreate the volume.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for production}
      POSTGRES_DB: ${POSTGRES_DB:-exam}
      # ADR-006: display/session timezone only; business time is instant-based.
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${APP_TIMEZONE:-Asia/Shanghai}
    volumes:
      # P7-C1 C1.1: canonical persistent data root. PostgreSQL durable state
      # is an operator-visible bind mount, NOT a Docker named volume. PGDATA
      # is intentionally NOT overridden: postgres:18.4-bookworm owns its
      # canonical PGDATA (/var/lib/postgresql/18/docker, per C0 §7). The host
      # layout ${EXAM_DATA_ROOT:-./data}/postgres/18/docker/... stays stable
      # across PG patch releases and is the exact-history relocation root.
      # EXAM_DATA_ROOT is a deployment physical binding (operator/env layer);
      # smoke/drills override it to a unique temp dir for isolation.
      - ${EXAM_DATA_ROOT:-./data}/postgres:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "${POSTGRES_USER:-exam}",
          "-d",
          "${POSTGRES_DB:-exam}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exam-net
    restart: unless-stopped

  # Redis is OPTIONAL in the implemented MVP (ADR-001 / P6-010), but it owns
  # the shared rate-limit state when enabled (P7) — so an ENABLED production
  # Redis MUST be authenticated (P7 review P1-1; ADR-001 security
  # considerations). The service is gated behind the `redis` profile: it is
  # NOT started by a bare `docker compose up`. The password check lives at
  # CONTAINER STARTUP (not Compose expansion), so the profile stays truly
  # optional: a bare `docker compose up` with REDIS_PASSWORD unset still
  # parses and runs. Only when the profile is enabled does the redis
  # container refuse to start without a password — never an open instance.
  # Enable it explicitly with `docker compose --profile redis up` (or set
  # COMPOSE_PROFILES=redis) AND set REDIS_URL on the `app` service to the
  # authenticated URL, `redis://:<REDIS_PASSWORD>@redis:6379`. Compose
  # config/inspect does not interpolate the secret into the stored command
  # definition — the command references `$REDIS_PASSWORD` and the container
  # shell expands it at startup (the redis-server argv then receives the
  # password via `--requirepass`, which is how requirepass is configured).
  # See docs/deployment/mvp-deployment-runbook.md §10.
  redis:
    image: redis:7.4.10-alpine
    # `$$` is the Compose escape: the container sees `$REDIS_PASSWORD`, not
    # the interpolated secret. The first line is the startup guard — the
    # shell fails the container when REDIS_PASSWORD is unset or empty, so
    # an unauthenticated server can never start. The second line runs the
    # server with requirepass read from the container environment.
    command:
      - sh
      - -ec
      - |
        : "$${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
        exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    profiles: ["redis"]
    environment:
      # P7 review P1: the empty default keeps Redis optional at Compose
      # parse time (a bare `docker compose up` needs no Redis
      # configuration); the startup guard above enforces the password when
      # the redis profile actually runs.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # P7-C1 C1.1: optional Redis persistence via the canonical data root.
      # Redis holds only non-authoritative rate-limit counters (C0 §8 / ADR-001);
      # deleting ${EXAM_DATA_ROOT:-./data}/redis is always safe for Exam truth.
      - ${EXAM_DATA_ROOT:-./data}/redis:/data
    healthcheck:
      # An unauthenticated ping must fail (NOAUTH) — the healthcheck itself
      # proves the server enforces the password.
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exam-net
    restart: unless-stopped

  # Email delivery worker (ADR-011). Required MVP process: drains the
  # PostgreSQL `email_outbox` table that `result_published` notifications
  # write into. Without this service, `docker compose up` would start the
  # API and DB but Email queued by the publication transaction would never
  # be sent. The worker is PostgreSQL-only (no Redis/Fastify); it resolves
  # the single internal default organization via the branding resolver. It
  # is intentionally NOT wired to start when EMAIL_ENABLED is false at the
  # Compose level: a stopped-but-restarted worker is harmless (it polls an
  # empty outbox and writes a heartbeat). Disable Email delivery by setting
  # EMAIL_ENABLED=false in the runtime env, not by removing this service.
  #
  # Migration ordering (P6-009): the worker self-migrates at startup via
  # `migratePostgres(db)`. The drizzle migration journal tracks applied
  # state; it is NOT a distributed lock and does NOT serialize concurrent
  # migration runners. To avoid racing the app container's migration call,
  # this service depends on `app: condition: service_healthy`, so the
  # required startup sequence is:
  #     db healthy → app entrypoint migrates → app becomes healthy
  #                → email-worker starts → worker's migratePostgres re-run
  #                → worker poll loop starts
  # The app's healthcheck only passes once the API is bound, which is
  # strictly after the entrypoint's `node dist/scripts/migrate.js` returns.
  #
  # The image's ENTRYPOINT is docker-entrypoint.sh, which hard-codes
  # `exec node dist/server.js`. To run the worker instead, override the
  # entrypoint to `node` and pass the worker entrypoint as the command.
  email-worker:
    image: ${EXAM_IMAGE:?EXAM_IMAGE is required — build/tag a production image and set EXAM_IMAGE (see docker-compose.build.yml for local source builds)}
    entrypoint: ["node"]
    command: ["dist/workers/emailDeliveryWorker.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-exam}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for production}@db:5432/${POSTGRES_DB:-exam}
      # JWT_SECRET is required by the runtime config loader at worker boot
      # (getRuntimeConfig → resolveJwtSecret fails fast in production
      # without it). The worker itself never signs or verifies JWTs.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required for production}
      NODE_ENV: production
      APP_MODE: production
      # PUBLIC_WEB_ORIGIN is validated at worker boot by runtimeConfig
      # (used to build Email action links).
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:?PUBLIC_WEB_ORIGIN is required for production}
      # CORS_ORIGIN is validated at worker boot by runtimeConfig
      # (resolveCorsOrigin fails fast in production without it). The worker
      # itself never serves CORS-protected responses, but the config loader
      # does not know that.
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required for production}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-singleTenant}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      TZ: ${TZ:-Asia/Shanghai}
      # Email transport — defaults match the bare/test deployment (sends
      # nothing). Set EMAIL_ENABLED=true + EMAIL_TRANSPORT=smtp + SMTP_* to
      # enable real delivery. See docs/architecture/email-config.md.
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-fake}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@example.local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Exam Platform}
      EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-3}
      EMAIL_RETRY_BASE_SECONDS: ${EMAIL_RETRY_BASE_SECONDS:-60}
      EMAIL_WORKER_POLL_INTERVAL_MS: ${EMAIL_WORKER_POLL_INTERVAL_MS:-5000}
      EMAIL_WORKER_BATCH_SIZE: ${EMAIL_WORKER_BATCH_SIZE:-20}
      EMAIL_WORKER_LOCK_TIMEOUT_MS: ${EMAIL_WORKER_LOCK_TIMEOUT_MS:-300000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    # P6-009: serialize migrations. The worker's startup migratePostgres
    # call MUST run strictly after the app container has completed its
    # migrations (the drizzle journal tracks state, it does not lock). The
    # app healthcheck only passes once the API is bound, which is strictly
    # after `node dist/scripts/migrate.js` returns. depending on db alone
    # would let the worker race the app's migrate call.
    depends_on:
      app:
        condition: service_healthy
    networks:
      - exam-net
    restart: unless-stopped

# NOTE (P7-C1 C1.1): there are no Docker named volumes in the production
# topology. All durable state is bind-mounted under ${EXAM_DATA_ROOT:-./data}.
# `docker compose down -v` therefore does NOT remove Exam data — it only
# removes named volumes (none defined). Use `rm -rf ${EXAM_DATA_ROOT}` to
# destroy authoritative state.

networks:
  exam-net:
    driver: bridge
