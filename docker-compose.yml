services:
  app:
    build: .
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-exam}:${POSTGRES_PASSWORD:-exam}@db:5432/${POSTGRES_DB:-exam}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      APP_MODE: production
      APP_PORT: 3000
      HOST: 0.0.0.0
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:?PUBLIC_WEB_ORIGIN is required for production}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-singleTenant}
      # ADR-006: runtime timezone (display/log/diagnostics only; does not
      # change business-time comparison semantics).
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - exam-net
    restart: unless-stopped

  db:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exam}
      POSTGRES_DB: ${POSTGRES_DB:-exam}
      # ADR-006: display/session timezone only; business time is instant-based.
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${APP_TIMEZONE:-Asia/Shanghai}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "${POSTGRES_USER:-exam}",
          "-d",
          "${POSTGRES_DB:-exam}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exam-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exam-net
    restart: unless-stopped

  # Email delivery worker (ADR-011). Required MVP process: drains the
  # PostgreSQL `email_outbox` table that `result_published` notifications
  # write into. Without this service, `docker compose up` would start the
  # API and DB but Email queued by the publication transaction would never
  # be sent. The worker is PostgreSQL-only (no Redis/Fastify); it
  # self-migrates at startup (idempotent via the drizzle journal, so it
  # does not race the app container's migrate call) and resolves the single
  # internal default organization via the branding resolver. It is
  # intentionally NOT wired to start when EMAIL_ENABLED is false at the
  # Compose level: a stopped-but-restarted worker is harmless (it polls an
  # empty outbox and writes a heartbeat). Disable Email delivery by setting
  # EMAIL_ENABLED=false in the runtime env, not by removing this service.
  #
  # The image's ENTRYPOINT is docker-entrypoint.sh, which hard-codes
  # `exec node dist/server.js`. To run the worker instead, override the
  # entrypoint to `node` and pass the worker entrypoint as the command.
  # The worker self-migrates before its poll loop, so no migrate step is
  # needed here.
  email-worker:
    build: .
    entrypoint: ["node"]
    command: ["dist/workers/emailDeliveryWorker.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-exam}:${POSTGRES_PASSWORD:-exam}@db:5432/${POSTGRES_DB:-exam}
      # JWT_SECRET is required by the runtime config loader at worker boot
      # (getRuntimeConfig → resolveJwtSecret fails fast in production
      # without it). The worker itself never signs or verifies JWTs.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required for production}
      NODE_ENV: production
      APP_MODE: production
      # PUBLIC_WEB_ORIGIN is validated at worker boot by runtimeConfig
      # (used to build Email action links).
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:?PUBLIC_WEB_ORIGIN is required for production}
      # CORS_ORIGIN is validated at worker boot by runtimeConfig
      # (resolveCorsOrigin fails fast in production without it). The worker
      # itself never serves CORS-protected responses, but the config loader
      # does not know that.
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required for production}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-singleTenant}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      TZ: ${TZ:-Asia/Shanghai}
      # Email transport — defaults match the bare/test deployment (sends
      # nothing). Set EMAIL_ENABLED=true + EMAIL_TRANSPORT=smtp + SMTP_* to
      # enable real delivery. See docs/architecture/email-config.md.
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-fake}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@example.local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Exam Platform}
      EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-3}
      EMAIL_RETRY_BASE_SECONDS: ${EMAIL_RETRY_BASE_SECONDS:-60}
      EMAIL_WORKER_POLL_INTERVAL_MS: ${EMAIL_WORKER_POLL_INTERVAL_MS:-5000}
      EMAIL_WORKER_BATCH_SIZE: ${EMAIL_WORKER_BATCH_SIZE:-20}
      EMAIL_WORKER_LOCK_TIMEOUT_MS: ${EMAIL_WORKER_LOCK_TIMEOUT_MS:-300000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - exam-net
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

networks:
  exam-net:
    driver: bridge
