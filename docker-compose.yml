# Sole operator entry point.
# Run with the deployment env file: docker compose --env-file .env.production ...
# (created by node scripts/init-production-env.mjs; the dev .env is never read when
# --env-file is passed). Authoritative state is the ./data bind mounts — see
# docs/deployment/mvp-deployment-runbook.md.
# #585 topology: nginx is the ONLY public ingress (host ${EXAM_PORT:-80} ->
# container 80); app (:3000, API) and web (:4173, static SPA) are internal
# services on exam-net.
services:
  app:
    # Operator path: prebuilt semantic image, pinned by EXAM_IMAGE in the
    # deployment env file (init-production-env.mjs derives the default from
    # .release-version — the single version authority). Contributors / PR
    # acceptance build THIS checkout explicitly and run this file against
    # the local pin (docker build --target runner -t exam-local:dev . — #626;
    # a cached registry image can never fake source acceptance).
    image: ${EXAM_IMAGE:?EXAM_IMAGE is required (node scripts/init-production-env.mjs)}
    # #585: the API is an internal service — nginx is the only public
    # ingress. Direct host publishing (the former ${EXAM_PORT:-3000}:3000)
    # moved to the nginx service. Development/test keeps using 3000
    # directly (host-native E2E / CI never involve this file).
    expose:
      - "3000"
    environment:
      # Application runtime settings are FORWARDED, not defaulted, here:
      # an empty `${KEY:-}` value reaches the app as "" and resolves to the
      # semantic default defined once in apps/api/src/config/settings.ts
      # (enforced by scripts/repository-contract/config-contract.mjs — a
      # literal fallback in this file may only mirror that same default).
      # Exceptions: APP_TIMEZONE (also drives the db service PGTZ literal)
      # and DEPLOYMENT_MODE keep explicit, parity-guarded literals.
      DATABASE_URL: postgresql://${POSTGRES_USER:-exam}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-exam}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (node scripts/init-production-env.mjs)}
      NODE_ENV: production
      APP_MODE: production
      APP_PORT: 3000
      HOST: 0.0.0.0
      # #585: nginx owns public :80, so the canonical production public
      # origin is http://localhost (no port suffix). Remapped EXAM_PORT or
      # LAN access must set both explicitly (.env.production.example).
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-singleTenant}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_MODE: ${REDIS_MODE:-}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-}
      REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-}
      REDIS_STARTUP_TIMEOUT_MS: ${REDIS_STARTUP_TIMEOUT_MS:-}
      LAUNCHPAD_SETUP_TOKEN: ${LAUNCHPAD_SETUP_TOKEN:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-}
      EMAIL_FAKE_MODE: ${EMAIL_FAKE_MODE:-}
      EMAIL_FAKE_DELAY_MS: ${EMAIL_FAKE_DELAY_MS:-}
      # Test/rehearsal-only fake-sender witness (#482): empty in any real
      # deployment; lets tests observe that the fake send path was entered.
      EMAIL_FAKE_SEND_ENTERED_FILE: ${EMAIL_FAKE_SEND_ENTERED_FILE:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-}
      EMAIL_RETRY_BASE_SECONDS: ${EMAIL_RETRY_BASE_SECONDS:-}
      EMAIL_WORKER_POLL_INTERVAL_MS: ${EMAIL_WORKER_POLL_INTERVAL_MS:-}
      EMAIL_WORKER_BATCH_SIZE: ${EMAIL_WORKER_BATCH_SIZE:-}
      EMAIL_WORKER_LOCK_TIMEOUT_MS: ${EMAIL_WORKER_LOCK_TIMEOUT_MS:-}
      EMAIL_WORKER_HEARTBEAT_STALE_MS: ${EMAIL_WORKER_HEARTBEAT_STALE_MS:-}
      EMAIL_WORKER_SHUTDOWN_TIMEOUT_MS: ${EMAIL_WORKER_SHUTDOWN_TIMEOUT_MS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-}
      SMTP_TLS_SERVERNAME: ${SMTP_TLS_SERVERNAME:-}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-}
      SMTP_GREETING_TIMEOUT_MS: ${SMTP_GREETING_TIMEOUT_MS:-}
      SMTP_SOCKET_TIMEOUT_MS: ${SMTP_SOCKET_TIMEOUT_MS:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Tunable runtime knobs (defaults live in settings.ts). Forwarded so
      # operators can override them via .env.production without editing Compose.
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      HEARTBEAT_SCAN_INTERVAL_MS: ${HEARTBEAT_SCAN_INTERVAL_MS:-}
      HEARTBEAT_TIMEOUT_MS: ${HEARTBEAT_TIMEOUT_MS:-}
      # Unset → defaults to HEARTBEAT_SCAN_INTERVAL_MS inside the app.
      DEADLINE_SCAN_INTERVAL_MS: ${DEADLINE_SCAN_INTERVAL_MS:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # #547 DEPLOYMENT READINESS GATE + #585 service split: the API leg
      # probes /api/ready (DB-aware mandatory-dependency gate — 503 => probe
      # exit 1), NOT the dependency-blind /api/health liveness probe. The
      # former bundled-SPA leg (fetch of '/' expecting text/html) is gone:
      # the SPA is served by the separate `web` service, which carries its
      # own HTML healthcheck — API health must not assume the API container
      # serves frontend HTML.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - exam-net
    restart: unless-stopped
    # INVARIANT: stop_grace_period MUST dominate the app's whole
    # graceful-shutdown worst case (email loop drain + audit drain + DB pool
    # close + bounded exit assist, run serially) — or a stuck in-flight email
    # send turns SIGTERM into SIGKILL (exit 137).
    stop_grace_period: 45s

  web:
    # #585: dedicated static Web runtime — nginx serving the built
    # apps/web/dist on :4173 (never `vite preview`; web.conf is baked into
    # the web-runner image). Internal service: nginx routes non-API traffic
    # here. The operator pin mirrors EXAM_IMAGE (#321 two-path split):
    # derived from .release-version; source builds pin it explicitly.
    image: ${EXAM_WEB_IMAGE:?EXAM_WEB_IMAGE is required (node scripts/init-production-env.mjs)}
    expose:
      - "4173"
    healthcheck:
      # #585 service split: the Web leg proves the SPA HTML is servable on
      # 4173 — the proof the app healthcheck no longer carries.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4173/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - exam-net
    restart: unless-stopped

  nginx:
    # #585: the ONLY public production ingress. Routes /api/** -> app:3000
    # (path preserved, #546 forwarded headers) and /* -> web:4173. The edge
    # config is deployment configuration — runtime-mounted read-only, never
    # baked into an image. HTTPS lives as a commented template in
    # deploy/nginx/edge.conf (mount certs at /etc/nginx/certs/ and publish
    # 443 to activate); the active profile is HTTP :80 only.
    image: nginx:1.30.5-alpine3.24
    ports:
      - "${EXAM_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - exam-net
    restart: unless-stopped

  db:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-exam}
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${APP_TIMEZONE:-Asia/Shanghai}
    volumes:
      - ${EXAM_DATA_ROOT:-./data}/postgres:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "${POSTGRES_USER:-exam}",
          "-d",
          "${POSTGRES_DB:-exam}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exam-net
    restart: unless-stopped

  # `$$` escapes Compose interpolation — the startup guard requires a
  # password at container runtime and the server runs with --requirepass.
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    command:
      - sh
      - -ec
      - |
        : "$${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
        exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${EXAM_DATA_ROOT:-./data}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exam-net
    restart: unless-stopped

  # Outbox delivery (#320 CONVERGE): the email outbox loop runs in-process
  # inside the app container (plugins/emailOutboxLoop.ts) — same PostgreSQL
  # semantics as the former dedicated worker (durable outbox, SKIP LOCKED,
  # retry/backoff, lock-timeout recovery, at-least-once). The standalone
  # worker entrypoint (`worker:email`) remains available as an escape hatch.
  # The app's EMAIL_* environment variables configure the loop's sender; the
  # app container is the sole migration owner (see ADR-011 §8.6/#320).

networks:
  exam-net:
    driver: bridge
