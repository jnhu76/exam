# P7-C3 WAL archiving seed config (initdb only).
#
# This file is mounted into /docker-entrypoint-initdb.d/ by
# docker-compose.pitr.yml. The official PostgreSQL image sources SQL/shell
# files there ONLY during first database initialization (empty data dir).
# For an already-initialized cluster, apply the same settings via
# ALTER SYSTEM (see scripts/deployment/p7-c3-pitr-drill.sh and
# docs/deployment/backup-and-recovery.md §8).
#
# archive_command uses the PostgreSQL-documented Unix idiom that REFUSES to
# silently overwrite a different WAL segment with the same filename:
#
#   test ! -f /wal-archive/%f && cp %p /wal-archive/%f
#
# (%p = source path of the WAL segment; %f = WAL filename). If a file with
# the target name already exists, the archive_command returns non-zero and
# archiving FAILS VISIBLY (archive_status stays .ready), satisfying the C3.5
# contract that a WAL filename collision must not silently overwrite different
# content. PostgreSQL will retry; the operator sees a stuck archive and
# investigates.
#
# wal_level=replica is already sufficient (confirmed at runtime); do NOT raise
# it to logical just for PITR — that adds WAL overhead without addressing the
# real (archiving) requirement.

ALTER SYSTEM SET archive_mode = 'on';
ALTER SYSTEM SET archive_command = 'test ! -f /wal-archive/%f && cp %p /wal-archive/%f';
ALTER SYSTEM SET archive_timeout = '60s';
