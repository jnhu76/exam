name: Publish release

on:
  push:
    branches:
      - master
    paths:
      - .release-version

permissions:
  contents: write

concurrency:
  group: repository-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release contract
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < .release-version)"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid .release-version: $version" >&2
            exit 1
          fi

          bare="${version#v}"
          notes="docs/releases/${version}.md"

          if ! grep -Fq "## [$bare] - " CHANGELOG.md; then
            echo "CHANGELOG.md has no dated [$bare] release section" >&2
            exit 1
          fi

          if [[ ! -f "$notes" ]]; then
            echo "Missing release notes: $notes" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Create or verify immutable tag
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.release.outputs.version }}"

          if git ls-remote --exit-code --tags origin "refs/tags/$version" > /tmp/release-tag 2>/dev/null; then
            git fetch --force origin "refs/tags/$version:refs/tags/$version"
            target="$(git rev-list -n 1 "$version")"
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "Refusing to move existing tag $version: $target != $GITHUB_SHA" >&2
              exit 1
            fi
            echo "Tag $version already points at this exact commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$version" "$GITHUB_SHA" -m "Exam $version"
            git push origin "refs/tags/$version"
          fi

      - name: Create GitHub Release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.release.outputs.version }}"
          notes="${{ steps.release.outputs.notes }}"

          if gh release view "$version" >/dev/null 2>&1; then
            echo "GitHub Release $version already exists."
          else
            gh release create "$version" \
              --verify-tag \
              --title "Exam $version" \
              --notes-file "$notes"
          fi
