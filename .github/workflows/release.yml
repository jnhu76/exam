name: Publish release

on:
  push:
    branches:
      - master
    paths:
      - .release-version

permissions:
  contents: write
  packages: write

concurrency:
  group: repository-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release contract
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < .release-version)"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid .release-version: $version" >&2
            exit 1
          fi

          bare="${version#v}"
          notes="docs/releases/${version}.md"

          if ! grep -Fq "## [$bare] - " CHANGELOG.md; then
            echo "CHANGELOG.md has no dated [$bare] release section" >&2
            exit 1
          fi

          if [[ ! -f "$notes" ]]; then
            echo "Missing release notes: $notes" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Create or verify immutable tag
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.release.outputs.version }}"

          if git ls-remote --exit-code --tags origin "refs/tags/$version" > /tmp/release-tag 2>/dev/null; then
            git fetch --force origin "refs/tags/$version:refs/tags/$version"
            target="$(git rev-list -n 1 "$version")"
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "Refusing to move existing tag $version: $target != $GITHUB_SHA" >&2
              exit 1
            fi
            echo "Tag $version already points at this exact commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$version" "$GITHUB_SHA" -m "Exam $version"
            git push origin "refs/tags/$version"
          fi

      - name: Create GitHub Release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.release.outputs.version }}"
          notes="${{ steps.release.outputs.notes }}"

          if gh release view "$version" >/dev/null 2>&1; then
            echo "GitHub Release $version already exists."
          else
            gh release create "$version" \
              --verify-tag \
              --title "Exam $version" \
              --notes-file "$notes"
          fi

      # #321 — publish the prebuilt production image for THIS exact release
      # source SHA. The semantic tag and the sha- alias are immutable by
      # policy: never overwrite an existing semantic tag with different
      # content, never attach an image built from a different SHA to an
      # existing release. `latest` is deliberately NOT published (mutable
      # convenience must never be an upgrade/rollback authority).
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jnhu76/exam
          # type=raw passes .release-version through EXACTLY (v-prefixed):
          # the semver type would strip the v ({{version}} of "v0.0.2" is
          # "0.0.2") and the operator EXAM_IMAGE pin would never resolve.
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=sha
          # latest=auto would ADD a latest tag for semver-style values;
          # the no-latest policy is enforced explicitly, not by omission.
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=exam
            org.opencontainers.image.description=Configurable LAN/on-premise exam and assessment platform
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/jnhu76/exam
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      - name: Build and push release image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Record published digest
        shell: bash
        run: |
          echo "image=ghcr.io/jnhu76/exam" >> "$GITHUB_STEP_SUMMARY"
          echo "tags=${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "source=${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
