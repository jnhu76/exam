name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Lint copy
        run: pnpm lint:copy

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: E2E / Smoke tests
        run: pnpm test:e2e

      - name: Coverage
        run: pnpm coverage

      - name: Check coverage thresholds
        run: |
          echo "## Coverage Gate"
          FAILED=""
          for PKG in apps/api apps/web packages/domain packages/contracts packages/db packages/auth packages/exam-engine; do
            if [ -d "$PKG/coverage" ]; then
              SUMMARY=$(cat "$PKG/coverage/coverage-summary.json" 2>/dev/null || echo '{}')
              LINES=$(echo "$SUMMARY" | jq -r '.total.lines.pct // 0' 2>/dev/null || echo 0)
              if [ "$LINES" != "null" ] && [ "$(echo "$LINES < 60" | bc 2>/dev/null || echo 1)" -eq 1 ]; then
                echo "::warning::$PKG line coverage is $LINES% (below 60% threshold)"
                FAILED="$FAILED $PKG"
              else
                echo "  $PKG: $LINES% lines"
              fi
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Coverage below 60% in:$FAILED"
            exit 1
          fi
          echo "All packages meet 60% line coverage threshold."

      - name: Build
        run: pnpm build
