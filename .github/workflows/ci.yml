name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (PostgreSQL 18.4)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: exam
          POSTGRES_PASSWORD: exam
          POSTGRES_DB: exam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U exam -d exam_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://exam:exam@localhost:5432/exam_test
      TEST_DATABASE_URL: postgresql://exam:exam@localhost:5432/exam_test
      JWT_SECRET: ci-test-secret
      NODE_ENV: test
      APP_MODE: ci
      DEPLOYMENT_MODE: singleTenant

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Lint copy
        run: pnpm lint:copy

      - name: Lint architecture
        run: pnpm lint:arch

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Coverage
        run: pnpm coverage

  e2e:
    name: E2E (Playwright Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: exam
          POSTGRES_PASSWORD: exam
          POSTGRES_DB: exam_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U exam -d exam_e2e"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://exam:exam@localhost:5432/exam_e2e
      TEST_DATABASE_URL: postgresql://exam:exam@localhost:5432/exam_e2e
      JWT_SECRET: e2e-test-secret
      NODE_ENV: test
      APP_MODE: e2e
      DEPLOYMENT_MODE: singleTenant
      E2E_BASE_URL: http://localhost:3000
      RATE_LIMIT_MAX: "1000"
      RATE_LIMIT_WINDOW_MS: "60000"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @exam/e2e exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Stage web assets for API static serving
        run: |
          rm -rf apps/api/public
          mkdir -p apps/api/public
          cp -R apps/web/dist/. apps/api/public/
          test -f apps/api/public/index.html

      - name: Run migrations
        run: pnpm --filter @exam/db db:migrate

      - name: Seed E2E data
        run: pnpm --filter @exam/api db:seed:e2e

      - name: Start API server
        run: |
          pnpm --filter @exam/api start > server.log 2>&1 &
          echo "API_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "API is healthy"
              break
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          curl -sf http://localhost:3000/api/health || (echo "API failed to start" && cat server.log && exit 1)
          curl -fsS http://localhost:3000/login | grep -q '<!doctype html\|<!DOCTYPE html\|<html' || (echo "SPA fallback not working: /login did not return HTML" && cat server.log && exit 1)
          echo "SPA fallback verified: /login returns HTML"

      - name: Run E2E tests
        run: pnpm --filter @exam/e2e test:e2e
        continue-on-error: false

      - name: Stop servers
        if: always()
        run: |
          kill $API_PID 2>/dev/null || true

      - name: Write E2E failure summary
        if: failure()
        run: |
          {
            echo "## E2E Failure Summary"
            echo ""
            echo "### Server log tail"
            echo '```text'
            tail -120 server.log || true
            echo '```'
            echo ""
            echo "### Playwright error contexts"
            find apps/e2e/test-results -name "error-context.md" -print 2>/dev/null | while IFS= read -r f; do
              if [ -f "$f" ]; then
                echo ""
                echo "#### $f"
                echo '```text'
                sed -n '1,160p' "$f" || true
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare E2E failure diagnostics
        if: failure()
        run: |
          rm -rf e2e-diagnostics
          mkdir -p e2e-diagnostics

          if [ -f server.log ]; then
            cp server.log e2e-diagnostics/server.log
            tail -200 server.log > e2e-diagnostics/server-tail.log || true
          fi

          find apps/e2e/test-results -name "error-context.md" -print -exec sh -c '
            for f do
              dest="e2e-diagnostics/$(echo "$f" | sed "s#apps/e2e/test-results/##" | tr "/" "_")"
              cp "$f" "$dest"
            done
          ' sh {} + 2>/dev/null || true

          find apps/e2e/test-results -name "*.png" -print -exec sh -c '
            for f do
              dest="e2e-diagnostics/$(echo "$f" | sed "s#apps/e2e/test-results/##" | tr "/" "_")"
              cp "$f" "$dest"
            done
          ' sh {} + 2>/dev/null || true

          {
            echo "## E2E diagnostics"
            echo ""
            echo "### Files"
            find e2e-diagnostics -type f -maxdepth 1 -printf "%f %s bytes\n" | sort || true
          } > e2e-diagnostics/summary.md

      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: e2e-failure-diagnostics
          path: e2e-diagnostics/
          retention-days: 1
          if-no-files-found: ignore
