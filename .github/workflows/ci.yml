name: CI

on:
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Turborepo remote cache — TURBO_TOKEN from secrets, TURBO_TEAM from vars
# (vars keeps team slug visible in logs; secrets would be censored).
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # ADR-007 Phase 6F: a fast, DB-free `static` job gates the heavier jobs.
  # `verify`, `api-fast`, and `e2e` all now `needs: static` instead of chaining
  # off `verify`, so they run in parallel once static checks pass. This cuts
  # wall-clock from (verify + max(api-fast, e2e)) to
  # (static + max(verify, api-fast, e2e)). Test semantics are unchanged; only
  # job dependencies changed. `verify` no longer repeats format/lint/typecheck
  # (static owns those).
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.x"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Static checks
        run: pnpm verify:static

  verify:
    name: Verify (PostgreSQL 18.4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: static

    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: exam
          POSTGRES_PASSWORD: exam
          POSTGRES_DB: exam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U exam -d exam_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://exam:exam@localhost:5432/exam_test
      TEST_DATABASE_URL: postgresql://exam:exam@localhost:5432/exam_test
      JWT_SECRET: ci-test-secret
      NODE_ENV: test
      APP_MODE: ci
      DEPLOYMENT_MODE: singleTenant
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.x"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Coverage is split into three independently-named steps so the failing
      # package is unambiguous in the GitHub UI (a single `turbo coverage` run
      # attributed web failures to "@exam/api:coverage" in logs, hiding the
      # real culprit). Splitting also isolates CPU: web (jsdom + V8
      # instrumentation, CPU-light but instrumentation-heavy) no longer fights
      # api/db (Postgres-heavy) for the same cores. No package is run twice.
      #
      # 0. Build workspace packages first. `pnpm --filter @exam/web coverage`
      #    runs vitest directly (bypassing Turbo's task graph), so the
      #    `^build` dependency declared in turbo.json does NOT apply. Without
      #    this step, @exam/domain/dist and @exam/contracts/dist don't exist,
      #    and Vite's import analysis fails with 21 "Failed to resolve import"
      #    errors. We use `--filter "./packages/*"` instead of
      #    `turbo build --filter=@exam/web...` because the latter also builds
      #    the web app itself (tsc -b && vite build), which is unnecessary for
      #    coverage and adds ~30s overhead. Package builds are fast (just tsc).
      - name: Build workspace packages
        run: pnpm --filter "./packages/*" build

      # 1. Web coverage — pure jsdom, no DB env needed.
      - name: Web coverage
        run: pnpm --filter @exam/web coverage

      # 2. API coverage — Postgres worker isolation, 4 parallel workers.
      - name: API coverage
        run: TEST_DB_ISOLATION=worker-database API_TEST_MAX_WORKERS=4 pnpm --filter @exam/api coverage

      # 3. Remaining workspace packages (db, authz, contracts, domain,
      #    exam-engine, import-export). Targets `packages/*` explicitly so
      #    @exam/web and @exam/api (both in apps/) cannot be run a second
      #    time. Each listed package defines a `coverage` script.
      - name: Package coverage (db + authz + contracts + domain + exam-engine + import-export)
        run: pnpm --filter "./packages/*" coverage

      - name: Build
        run: pnpm build

  e2e:
    name: E2E (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: static
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]

    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: exam
          POSTGRES_PASSWORD: exam
          POSTGRES_DB: exam_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U exam -d exam_e2e"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://exam:exam@localhost:5432/exam_e2e
      TEST_DATABASE_URL: postgresql://exam:exam@localhost:5432/exam_e2e
      JWT_SECRET: e2e-test-secret
      NODE_ENV: test
      APP_MODE: e2e
      DEPLOYMENT_MODE: singleTenant
      E2E_BASE_URL: http://localhost:3000
      RATE_LIMIT_MAX: "1000"
      RATE_LIMIT_WINDOW_MS: "60000"
      HEARTBEAT_TIMEOUT_MS: "15000"
      HEARTBEAT_SCAN_INTERVAL_MS: "5000"
      DEADLINE_SCAN_INTERVAL_MS: "5000"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.x"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @exam/e2e exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Stage web assets for API static serving
        run: |
          rm -rf apps/api/public
          mkdir -p apps/api/public
          cp -R apps/web/dist/. apps/api/public/
          test -f apps/api/public/index.html

      - name: Run migrations
        run: pnpm --filter @exam/db db:migrate

      - name: Seed E2E data
        run: pnpm --filter @exam/api db:seed:e2e

      - name: Start API server
        run: |
          pnpm --filter @exam/api start > server.log 2>&1 &
          echo "API_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "API is healthy"
              break
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          curl -sf http://localhost:3000/api/health || (echo "API failed to start" && cat server.log && exit 1)
          curl -fsS http://localhost:3000/login | grep -q '<!doctype html\|<!DOCTYPE html\|<html' || (echo "SPA fallback not working: /login did not return HTML" && cat server.log && exit 1)
          echo "SPA fallback verified: /login returns HTML"

      - name: Run E2E tests (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: pnpm --filter @exam/e2e test:e2e -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          # Triggers blob reporter in playwright.config.ts (→ merge-reports).
          E2E_SHARD_TOTAL: ${{ matrix.shardTotal }}

      # Playwright blob reporter always writes `report.zip`. With merge-multiple,
      # download-artifact flattens all matching artifacts into one directory —
      # two `report.zip` files would collide (second overwrites first), producing
      # the "invalid central directory file header signature" error. Rename each
      # shard's zip to a unique name before uploading.
      - name: Rename blob report for uniqueness
        if: ${{ !cancelled() }}
        run: |
          if [ -f apps/e2e/blob-report/report.zip ]; then
            mv apps/e2e/blob-report/report.zip "apps/e2e/blob-report/report-${{ matrix.shardIndex }}.zip"
          fi

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: e2e-blob-shard-${{ matrix.shardIndex }}
          path: apps/e2e/blob-report/*.zip
          retention-days: 1
          if-no-files-found: ignore

      - name: Stop servers
        if: always()
        run: |
          kill $API_PID 2>/dev/null || true

      - name: Write E2E failure summary
        if: failure()
        run: |
          {
            echo "## E2E Failure Summary (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})"
            echo ""
            echo "### Server log tail"
            echo '```text'
            tail -120 server.log || true
            echo '```'
            echo ""
            echo "### Playwright error contexts"
            find apps/e2e/test-results -name "error-context.md" -print 2>/dev/null | while IFS= read -r f; do
              if [ -f "$f" ]; then
                echo ""
                echo "#### $f"
                echo '```text'
                sed -n '1,160p' "$f" || true
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare E2E failure diagnostics
        if: failure()
        run: |
          rm -rf e2e-diagnostics
          mkdir -p e2e-diagnostics

          if [ -f server.log ]; then
            cp server.log e2e-diagnostics/server.log
            tail -200 server.log > e2e-diagnostics/server-tail.log || true
          fi

          find apps/e2e/test-results -name "error-context.md" -print -exec sh -c '
            for f do
              dest="e2e-diagnostics/$(echo "$f" | sed "s#apps/e2e/test-results/##" | tr "/" "_")"
              cp "$f" "$dest"
            done
          ' sh {} + 2>/dev/null || true

          find apps/e2e/test-results -name "*.png" -print -exec sh -c '
            for f do
              dest="e2e-diagnostics/$(echo "$f" | sed "s#apps/e2e/test-results/##" | tr "/" "_")"
              cp "$f" "$dest"
            done
          ' sh {} + 2>/dev/null || true

          {
            echo "## E2E diagnostics"
            echo ""
            echo "### Files"
            find e2e-diagnostics -type f -maxdepth 1 -printf "%f %s bytes\n" | sort || true
          } > e2e-diagnostics/summary.md

      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: e2e-failure-diagnostics-${{ matrix.shardIndex }}
          path: e2e-diagnostics/
          retention-days: 1
          if-no-files-found: ignore

  e2e-merge:
    name: Merge E2E reports
    if: ${{ !cancelled() }}
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.x"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports from all shards
        uses: actions/download-artifact@v4
        with:
          path: apps/e2e/all-blob-reports
          pattern: e2e-blob-shard-*
          merge-multiple: true

      - name: Diagnose blob reports before merge
        working-directory: apps/e2e
        run: |
          echo "=== Files in all-blob-reports ==="
          find all-blob-reports -maxdepth 2 -type f -print -exec file {} \;
          echo ""
          echo "=== Validating zip integrity ==="
          for z in all-blob-reports/*.zip; do
            if [ -f "$z" ]; then
              echo "Checking $z ..."
              unzip -t "$z"
            fi
          done

      - name: Merge into HTML report
        working-directory: apps/e2e
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: playwright-html-report
          path: apps/e2e/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
