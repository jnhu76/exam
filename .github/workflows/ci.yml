name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Turborepo remote cache — TURBO_TOKEN from secrets, TURBO_TEAM from vars
# (vars keeps team slug visible in logs; secrets would be censored).
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # ADR-007 Phase 6F: a fast, DB-free `static` job gates the heavier jobs.
  # `verify`, `api-fast`, and `e2e` all now `needs: static` instead of chaining
  # off `verify`, so they run in parallel once static checks pass. This cuts
  # wall-clock from (verify + max(api-fast, e2e)) to
  # (static + max(verify, api-fast, e2e)). Test semantics are unchanged; only
  # job dependencies changed. `verify` no longer repeats format/lint/typecheck
  # (static owns those).
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.x"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Static checks
        run: pnpm verify:static

  verify:
    name: Verify (PostgreSQL 18.4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: static

    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: exam
          POSTGRES_PASSWORD: exam
          POSTGRES_DB: exam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U exam -d exam_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://exam:exam@localhost:5432/exam_test
      TEST_DATABASE_URL: postgresql://exam:exam@localhost:5432/exam_test
      JWT_SECRET: ci-test-secret
      NODE_ENV: test
      APP_MODE: ci
      DEPLOYMENT_MODE: singleTenant
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.x"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Coverage runs ALL packages (web/auth/domain/contracts/exam-engine/
      # import-export via turbo, db/api via vitest run --coverage) in a single
      # pass. `turbo coverage` internally parallelizes packages. No separate
      # `test` or `test:integration` pass needed — coverage already executes
      # every test. (test:integration is a literal alias of `test`/`vitest run`
      # in db+api, so running it again would duplicate the full DB/API suites.)
      - name: Coverage (all packages)
        # API_TEST_MAX_WORKERS + TEST_DB_ISOLATION=worker-database enable
        # parallel file execution for @exam/api (each worker gets its own DB
        # schema). Other packages ignore these env vars. ~2.5x faster than the
        # serial default (fileParallelism:false). Validated stable across
        # repeated runs (auth.test.ts timeouts resolved by per-worker isolation).
        run: TEST_DB_ISOLATION=worker-database API_TEST_MAX_WORKERS=4 pnpm coverage

      - name: Build
        run: pnpm build

  e2e:
    name: E2E (Playwright Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: static

    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: exam
          POSTGRES_PASSWORD: exam
          POSTGRES_DB: exam_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U exam -d exam_e2e"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://exam:exam@localhost:5432/exam_e2e
      TEST_DATABASE_URL: postgresql://exam:exam@localhost:5432/exam_e2e
      JWT_SECRET: e2e-test-secret
      NODE_ENV: test
      APP_MODE: e2e
      DEPLOYMENT_MODE: singleTenant
      E2E_BASE_URL: http://localhost:3000
      RATE_LIMIT_MAX: "1000"
      RATE_LIMIT_WINDOW_MS: "60000"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.x"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @exam/e2e exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Stage web assets for API static serving
        run: |
          rm -rf apps/api/public
          mkdir -p apps/api/public
          cp -R apps/web/dist/. apps/api/public/
          test -f apps/api/public/index.html

      - name: Run migrations
        run: pnpm --filter @exam/db db:migrate

      - name: Seed E2E data
        run: pnpm --filter @exam/api db:seed:e2e

      - name: Start API server
        run: |
          pnpm --filter @exam/api start > server.log 2>&1 &
          echo "API_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "API is healthy"
              break
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          curl -sf http://localhost:3000/api/health || (echo "API failed to start" && cat server.log && exit 1)
          curl -fsS http://localhost:3000/login | grep -q '<!doctype html\|<!DOCTYPE html\|<html' || (echo "SPA fallback not working: /login did not return HTML" && cat server.log && exit 1)
          echo "SPA fallback verified: /login returns HTML"

      - name: Run E2E tests
        run: pnpm --filter @exam/e2e test:e2e
        continue-on-error: false

      - name: Stop servers
        if: always()
        run: |
          kill $API_PID 2>/dev/null || true

      - name: Write E2E failure summary
        if: failure()
        run: |
          {
            echo "## E2E Failure Summary"
            echo ""
            echo "### Server log tail"
            echo '```text'
            tail -120 server.log || true
            echo '```'
            echo ""
            echo "### Playwright error contexts"
            find apps/e2e/test-results -name "error-context.md" -print 2>/dev/null | while IFS= read -r f; do
              if [ -f "$f" ]; then
                echo ""
                echo "#### $f"
                echo '```text'
                sed -n '1,160p' "$f" || true
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare E2E failure diagnostics
        if: failure()
        run: |
          rm -rf e2e-diagnostics
          mkdir -p e2e-diagnostics

          if [ -f server.log ]; then
            cp server.log e2e-diagnostics/server.log
            tail -200 server.log > e2e-diagnostics/server-tail.log || true
          fi

          find apps/e2e/test-results -name "error-context.md" -print -exec sh -c '
            for f do
              dest="e2e-diagnostics/$(echo "$f" | sed "s#apps/e2e/test-results/##" | tr "/" "_")"
              cp "$f" "$dest"
            done
          ' sh {} + 2>/dev/null || true

          find apps/e2e/test-results -name "*.png" -print -exec sh -c '
            for f do
              dest="e2e-diagnostics/$(echo "$f" | sed "s#apps/e2e/test-results/##" | tr "/" "_")"
              cp "$f" "$dest"
            done
          ' sh {} + 2>/dev/null || true

          {
            echo "## E2E diagnostics"
            echo ""
            echo "### Files"
            find e2e-diagnostics -type f -maxdepth 1 -printf "%f %s bytes\n" | sort || true
          } > e2e-diagnostics/summary.md

      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: e2e-failure-diagnostics
          path: e2e-diagnostics/
          retention-days: 1
          if-no-files-found: ignore
