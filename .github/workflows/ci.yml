name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (PostgreSQL 18.4)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: exam
          POSTGRES_PASSWORD: exam
          POSTGRES_DB: exam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U exam -d exam_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://exam:exam@localhost:5432/exam_test
      TEST_DATABASE_URL: postgresql://exam:exam@localhost:5432/exam_test
      JWT_SECRET: ci-test-secret
      NODE_ENV: test
      APP_MODE: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Lint copy
        run: pnpm lint:copy

      - name: Lint architecture
        run: pnpm lint:arch

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Stage web assets for API static serving
        run: |
          mkdir -p apps/api/public
          cp -r apps/web/dist/. apps/api/public/

      - name: Seed database (admin/teacher/candidate users)
        run: pnpm db:seed

      - name: Install Playwright browsers
        run: pnpm --filter @exam/e2e exec playwright install --with-deps chromium

      - name: Start API server in background
        env:
          APP_PORT: "3000"
          HOST: 127.0.0.1
          RATE_LIMIT_DISABLED: "true"
          COOKIE_SECURE: "false"
        run: |
          mkdir -p /tmp/exam-ci
          nohup node apps/api/dist/server.js > /tmp/exam-ci/server.log 2>&1 &
          echo $! > /tmp/exam-ci/server.pid
          echo "API server PID: $(cat /tmp/exam-ci/server.pid)"

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health > /dev/null; then
              echo "API is healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to become healthy in 60s"
          echo "----- server.log -----"
          cat /tmp/exam-ci/server.log || true
          exit 1

      - name: E2E / Smoke tests
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_ORG_SLUG: default
          E2E_ADMIN_USERNAME: admin
          E2E_ADMIN_PASSWORD: admin123
        run: pnpm test:e2e

      - name: Stop API server
        if: always()
        run: |
          if [ -f /tmp/exam-ci/server.pid ]; then
            kill "$(cat /tmp/exam-ci/server.pid)" 2>/dev/null || true
          fi

      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/exam-ci/server.log || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

      - name: Coverage
        run: pnpm coverage
