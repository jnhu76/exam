name: OpenCodeReview

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ocr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Review PR with OpenCodeReview
        uses: alibaba/open-code-review@04284b5dc19e0f52528ca466a767e4a2c100e5f5
        with:
          ocr_version: '1.11.6'
          llm_url: https://opencode.ai/zen/go/v1/chat/completions
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: mimo-v2.5
          llm_use_anthropic: 'false'
          llm_extra_body: '{}'
          language: Chinese
          effort: high
          llm_timeout: '300'
          review_task_timeout: '20'
          stream_progress: 'true'
          sticky_summary: 'true'
          incremental: 'true'
          checkpoint_range: 'true'
          route_severity_below: low
          route_categories: style
          background: >-
            Exam is a self-hosted TypeScript assessment platform with strict
            correctness requirements around authorization, exam lifecycle,
            answer persistence, grading, publication, recovery, email delivery,
            and operations. Review for RBAC/capability-boundary bypasses,
            tenant/scope or parent-chain mistakes, transaction and concurrency
            bugs, idempotency/versioning regressions, persistence alias/state
            mutation, information disclosure, unsafe result publication,
            queue/lock/retry bugs, migration/data-integrity risks, frontend/API
            contract drift, and missing regression tests. Security fixes should
            be narrow and executable evidence should prove both the original
            defect and the fix. Treat current specs/ADRs as authority over
            archived plans.