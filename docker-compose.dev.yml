# Pinned so a same-checkout prod stack (docker-compose.yml, `exam-prod`)
# can never share the directory-derived `exam` project with dev.
name: exam-dev
services:
  db:
    image: postgres:18.4-bookworm
    ports:
      # DB_HOST_PORT owns the dev host port (default 5432).
      - "${DB_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
      POSTGRES_DB: exam
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${APP_TIMEZONE:-Asia/Shanghai}
    command: postgres -c default_transaction_isolation='repeatable read'
    # No initdb mount: the test `exam_test` database is self-provisioned by
    # the test harness (testDbBootstrap.ts), which also heals an already-
    # initialized container — an initdb script could not.
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "exam", "-d", "exam"]
      interval: 2s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # REDIS_HOST_PORT owns the dev host port (default 6379).
      - "${REDIS_HOST_PORT:-6379}:6379"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
