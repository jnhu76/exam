services:
  app:
    build: .
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: sqlite:./data/dev.db
      JWT_SECRET: ${JWT_SECRET:-change-me-in-development}
      NODE_ENV: development
      APP_PORT: 3000
      HOST: 0.0.0.0
      COOKIE_SECURE: "false"
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    volumes:
      - sqlite-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/system/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - exam-net
    restart: unless-stopped

volumes:
  sqlite-data:

networks:
  exam-net:
    driver: bridge
