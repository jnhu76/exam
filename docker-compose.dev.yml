services:
  db:
    image: postgres:18.4-bookworm
    ports:
      # DB_HOST_PORT owns the dev host port (default 5432 — verified available
      # on WSL2/Docker Desktop; see docs/development/ports.md).
      - "${DB_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
      POSTGRES_DB: exam
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${APP_TIMEZONE:-Asia/Shanghai}
    command: postgres -c default_transaction_isolation='repeatable read'
    # NOTE: no /docker-entrypoint-initdb.d mount. POSTGRES_DB creates the dev
    # `exam` database; the test `exam_test` database is self-provisioned by
    # the test harness (packages/db/src/testDbBootstrap.ts) on the implicit
    # local URL, so it is (re)created whenever missing — including on a
    # container whose initdb phase already ran (which an initdb script could
    # never heal).
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "exam", "-d", "exam"]
      interval: 2s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
