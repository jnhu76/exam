services:
  db:
    # P7-C1 C1.1: this is the DEV topology only. It intentionally does NOT use
    # the production bind-mount layout (${EXAM_DATA_ROOT:-./data}/postgres):
    # the human's dev DB lives in an anonymous volume and the three-DB split
    # (exam / exam_test / exam_e2e) is disposable dev/test state (AGENTS.md
    # "Local Database Discipline"). The portable bind-mount + EXAM_DATA_ROOT
    # contract lives in docker-compose.yml (production) only.
    image: postgres:18.4-bookworm
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
      POSTGRES_DB: exam
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${APP_TIMEZONE:-Asia/Shanghai}
    command: postgres -c default_transaction_isolation='repeatable read'
    # Create the exam_test database (required by pnpm test's testDb.ts
    # name-safety check) alongside the exam dev DB. POSTGRES_DB auto-creates
    # only one DB; this init script creates the second. Runs once on first
    # initialization (empty data dir) per the postgres image convention.
    volumes:
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "exam", "-d", "exam"]
      interval: 2s
      timeout: 3s
      retries: 10

  redis:
    # P7-C1 C1.2: redis patch pin parity with docker-compose.yml. Redis is
    # non-authoritative (C0 §8); the pin is hygiene, not correctness.
    image: redis:7.4.10-alpine
    ports:
      - "6379:6379"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
