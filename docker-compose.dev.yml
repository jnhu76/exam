services:
  db:
    image: postgres:18.4-bookworm
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
      POSTGRES_DB: exam
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${APP_TIMEZONE:-Asia/Shanghai}
    # Create the exam_test database (required by pnpm test's testDb.ts
    # name-safety check) alongside the exam dev DB. POSTGRES_DB auto-creates
    # only one DB; this init script creates the second. Runs once on first
    # initialization (empty data dir) per the postgres image convention.
    volumes:
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "exam", "-d", "exam"]
      interval: 2s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
