# docker-compose.test.override.yml
#
# Local-only override for docker-compose.test.yml.
#
# docker-compose.test.yml now defaults to non-conflicting host ports
# (app: 3300, db: 5433) so this override no longer needs to remap ports.
# It is kept for backwards compatibility with existing workflows and CI
# scripts that reference COMPOSE_FILE with this file.
#
# The app <-> db internal traffic stays on the docker network (db:5432);
# only the host-published ports are exposed, and they no longer collide
# with a dev DB on :5432 or a dev app on :3000.
#
# Usage:
#   COMPOSE_FILE=docker-compose.test.yml:docker-compose.test.override.yml \
#     bash scripts/e2e/run.sh
