services:
  db:
    image: postgres:18.3-alpine3.23
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
      POSTGRES_DB: exam_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam"]
      interval: 2s
      timeout: 3s
      retries: 10
