services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
      POSTGRES_DB: exam_test
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "exam", "-d", "exam_test"]
      interval: 2s
      timeout: 3s
      retries: 10
