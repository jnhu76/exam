services:
  app:
    build: .
    ports:
      - "${EXAM_PORT:-3000}:3000"
    environment:
      # DB URLs are templated from the db service's POSTGRES_* vars so the db
      # name has a single source (POSTGRES_DB) — no 4-way hardcoded duplication.
      # The default must stay on the E2E full-reset allowlist (exam_e2e,
      # exam_e2e_w<N>, exam_ci*): RUN_SEED=e2e reseeds with reset:true, whose
      # guard refuses vitest-territory names like exam_test — an E2E stack
      # named exam_test fails app startup deterministically (#330 review P1-1).
      DATABASE_URL: postgresql://${POSTGRES_USER:-exam}:${POSTGRES_PASSWORD:-exam}@db:5432/${POSTGRES_DB:-exam_e2e}
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-exam}:${POSTGRES_PASSWORD:-exam}@db:5432/${POSTGRES_DB:-exam_e2e}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-e2e-test-secret}
      NODE_ENV: development
      APP_MODE: e2e
      APP_PORT: 3000
      HOST: 0.0.0.0
      COOKIE_SECURE: "false"
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-singleTenant}
      # Identity one-time links (#297: invitation accept, password reset) are
      # built from PUBLIC_WEB_ORIGIN and must carry the origin the browser
      # actually uses — the published EXAM_PORT, same as E2E_BASE_URL — not
      # the dev default, or the e2e links point at a closed port.
      PUBLIC_WEB_ORIGIN: http://localhost:${EXAM_PORT:-3000}
      # ADR-006: runtime timezone (display/log/diagnostics only; does not
      # change business-time comparison semantics).
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      TZ: ${TZ:-Asia/Shanghai}
      # E2E uses the canonical seed (baseline + demo: candidate1..4).
      RUN_SEED: "e2e"
      # APP_MODE=e2e disables the rate-limit plugin in runtimeConfig, but we
      # also keep these env vars for parity with CI E2E.
      RATE_LIMIT_DISABLED: "1"
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-1000}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      # Fast background scanners for E2E only (P2A-J6 abnormal-path specs).
      # These override the production defaults (heartbeat timeout 60s / scan
      # 30s, deadline scan 30s) so that disconnect/restore and deadline-crash
      # E2E tests are deterministic without multi-minute wall-clock waits.
      # Production deployments keep the defaults via docker-compose.yml.
      HEARTBEAT_TIMEOUT_MS: ${HEARTBEAT_TIMEOUT_MS:-15000}
      HEARTBEAT_SCAN_INTERVAL_MS: ${HEARTBEAT_SCAN_INTERVAL_MS:-5000}
      DEADLINE_SCAN_INTERVAL_MS: ${DEADLINE_SCAN_INTERVAL_MS:-5000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      exam-net:
        # Chromium's HSTS preload list includes the bare hostname `app` (Google's
        # `.app` TLD is force-HTTPS). Visiting `http://app:3000/` from the e2e
        # container therefore upgrades to HTTPS → ERR_SSL_PROTOCOL_ERROR, since
        # the app container is plain HTTP. We expose a safe alias `examapp` so
        # `docker compose --profile e2e run e2e` works without the IP-resolution
        # dance that scripts/e2e/run.sh performs.
        aliases:
          - examapp
    restart: unless-stopped

  db:
    image: postgres:18.4-bookworm
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    environment:
      # Single source for the db name/creds; the app URLs and healthcheck
      # interpolate these same vars so they can never diverge.
      POSTGRES_USER: ${POSTGRES_USER:-exam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exam}
      POSTGRES_DB: ${POSTGRES_DB:-exam_e2e}
      # ADR-006: display/session timezone only; business time is instant-based.
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${APP_TIMEZONE:-Asia/Shanghai}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "${POSTGRES_USER:-exam}",
          "-d",
          "${POSTGRES_DB:-exam_e2e}",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - exam-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - exam-net
    restart: unless-stopped

  e2e:
    image: mcr.microsoft.com/playwright:v1.61.0-noble
    init: true
    ipc: host
    # Share the app container's network namespace so the browser reaches the
    # app at http://localhost:3000. Two reasons this must be localhost (not the
    # app service name, an alias, or the container IP — the historical
    # workarounds):
    #   1. Chromium HSTS-preloads the bare hostname `app` → forced HTTPS →
    #      ERR_SSL_PROTOCOL_ERROR against the plain-HTTP app.
    #   2. Plain HTTP on a NON-localhost origin is not a secure context, so
    #      `navigator.locks` (Web Locks API) is undefined — the operator-grant
    #      PendingGrantCoordinator fail-closes and every grant-dialog spec
    #      (recovery-time-grant, recovery-operations-a11y, cross-tab) fails.
    #      localhost/127.0.0.1 is a potentially-trustworthy origin: secure
    #      context, no HSTS preload entry.
    network_mode: "service:app"
    depends_on:
      app:
        condition: service_healthy
    working_dir: /app/apps/e2e
    volumes:
      - ./apps/e2e:/app/apps/e2e
      - ./packages:/app/packages:ro
      # Workspace node_modules (read-only): specs resolve @playwright/test and
      # @exam/* through the pnpm symlink farm, whose RELATIVE targets need both
      # /app/packages (above) and /app/node_modules mounted. The historical
      # in-container `npm install` cannot be used anymore: apps/e2e/package.json
      # declares pnpm `workspace:*` devDependencies (since d91e401e) and npm
      # aborts with EUNSUPPORTEDPROTOCOL — which silently killed the whole
      # Docker E2E path because run.sh redirected the installer's output.
      - ./node_modules:/app/node_modules:ro
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
    environment:
      E2E_BASE_URL: "http://localhost:3000"
      HOME: /tmp
      HTTP_PROXY: ${E2E_PROXY:-}
      HTTPS_PROXY: ${E2E_PROXY:-}
    command: >-
      sh -c "test -e node_modules/@playwright/test ||
             { echo 'node_modules/@playwright/test not resolvable in container: run pnpm install at repo root' >&2; exit 1; } &&
             npx playwright test --reporter=list"
    profiles:
      - e2e

volumes:
  pgdata:

networks:
  exam-net:
    driver: bridge
