\* REC-I4-F1 — Operator Grant Client Safety configuration.
\* Exhaustive BFS over the client-side cross-tab command coordination.
\* All legacy flags FALSE — target semantics only.
\*
\* Run with:
\*   TLA2TOOLS_JAR=/path/to/tla2tools.jar pnpm formal:operator-grant:client

SPECIFICATION Spec

INVARIANT ClientTypeOK
INVARIANT FrozenCommandImmutable
INVARIANT IndeterminatePreservesCommandIdentity
INVARIANT AtMostOneUnresolvedCommandPerWorkflow
INVARIANT NoSecondSubmitWhileUnresolved
INVARIANT ReloadRestoresExactCommand
INVARIANT TerminalNeverReportedAsGranted

CONSTANTS
  Tabs = {Tab1, Tab2}
  CmdIds = {C1, C2}
  Ops = {O1, O2}
  Payloads = {P1, P2}
  C1 = C1
  C2 = C2
  LegacyPerTabPending = FALSE
  LegacyNewIdentityAfterLoss = FALSE
  LegacyMutableRetry = FALSE
  LegacyTerminalAsGranted = FALSE
