\* REC-I4-F1 — Target reachability witness.
\*
\* Expected: NoSameAttemptDifferentPayloadConflictWitness is violated, proving
\* that same operationId + same Attempt + different payload reaches conflict.

SPECIFICATION Spec

INVARIANT NoSameAttemptDifferentPayloadConflictWitness

CONSTANTS
  Attempts = {A1, A2}
  Txs = {T1, T2}
  Operations = {Op1}
  Payloads = {P1, P2}
  LegacyDuplicateEffect = FALSE
  LegacyLedgerOnlyCommit = FALSE
  LegacyDeadlineOnlyCommit = FALSE
  LegacyWrongConflictOutcome = FALSE
  LegacyTerminalGrant = FALSE
  LegacyRetryDuplicateApply = FALSE
