\* REC-I4-F1 — Target reachability witness.
\*
\* Expected: NoSameAttemptReplayWitness is violated, proving that two distinct
\* transactions with the same operationId, Attempt, and payload can reach the
\* fresh-transaction idempotent_replay outcome.

SPECIFICATION Spec

INVARIANT NoSameAttemptReplayWitness

CONSTANTS
  Attempts = {A1, A2}
  Txs = {T1, T2}
  Operations = {Op1}
  Payloads = {P1, P2}
  LegacyDuplicateEffect = FALSE
  LegacyLedgerOnlyCommit = FALSE
  LegacyDeadlineOnlyCommit = FALSE
  LegacyWrongConflictOutcome = FALSE
  LegacyTerminalGrant = FALSE
  LegacyRetryDuplicateApply = FALSE
