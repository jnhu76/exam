\* REC-I4-F1 — Expected-counterexample configuration.
\*
\* Legacy defect: a terminal Attempt still receives a deadline effect
\* (LegacyTerminalGrant).
\*
\* Expected: TerminalAttemptNeverGranted is violated.
\*   A transaction targeting a terminal Attempt gets outcome "granted"
\*   and the deadline effect is applied.

SPECIFICATION Spec

INVARIANT TerminalAttemptNeverGranted

CONSTANTS
  Attempts = {A1, A2}
  Exams = {E1, E2}
  Txs = {T1, T2}
  Operations = {Op1}
  Payloads = {P1, P2}
  LegacyDuplicateEffect = FALSE
  LegacyPartialCommit = FALSE
  LegacyWrongConflictOutcome = FALSE
  LegacyTerminalGrant = TRUE
