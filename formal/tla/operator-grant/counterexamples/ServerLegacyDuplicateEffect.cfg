\* REC-I4-F1 — Expected-counterexample configuration.
\*
\* Legacy defect: a second transaction bypasses operation uniqueness, inserts
\* a second ledger row, and applies another deadline effect.
\*
\* Expected: AtMostOneLedgerPerOperation is violated.
\*   The same operationId has two committed ledger facts.

SPECIFICATION Spec

INVARIANT AtMostOneLedgerPerOperation

CONSTANTS
  Attempts = {A1, A2}
  Txs = {T1, T2}
  Operations = {Op1}
  Payloads = {P1, P2}
  LegacyDuplicateEffect = TRUE
  LegacyLedgerOnlyCommit = FALSE
  LegacyDeadlineOnlyCommit = FALSE
  LegacyWrongConflictOutcome = FALSE
  LegacyTerminalGrant = FALSE
  LegacyRetryDuplicateApply = FALSE
