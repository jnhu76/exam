\* REC-I4-F1 — Expected-counterexample configuration.
\*
\* Legacy defect: a second transaction bypasses the operation uniqueness
\* constraint and applies a duplicate deadline effect (LegacyDuplicateEffect).
\*
\* Expected: AtMostOneDeadlineEffectPerOperation is violated.
\*   Two distinct Attempts receive a deadline effect from the same operationId.

SPECIFICATION Spec

INVARIANT AtMostOneDeadlineEffectPerOperation

CONSTANTS
  Attempts = {A1, A2}
  Exams = {E1, E2}
  Txs = {T1, T2}
  Operations = {Op1}
  Payloads = {P1, P2}
  LegacyDuplicateEffect = TRUE
  LegacyPartialCommit = FALSE
  LegacyWrongConflictOutcome = FALSE
  LegacyTerminalGrant = FALSE
