\* REC-I4-F1 — Expected-counterexample configuration.
\*
\* Legacy defect: after response loss, a reload discards the old command
\* identity and creates a fresh one (LegacyNewIdentityAfterLoss).
\*
\* Expected: IndeterminatePreservesCommandIdentity is violated.
\*   The frozen command after reload does not match the shared authority
\*   because the old identity was discarded.

SPECIFICATION Spec

INVARIANT IndeterminatePreservesCommandIdentity

CONSTANTS
  Tabs = {Tab1, Tab2}
  CmdIds = {C1, C2}
  Ops = {O1, O2}
  Payloads = {P1, P2}
  C1 = C1
  C2 = C2
  LegacyPerTabPending = FALSE
  LegacyNewIdentityAfterLoss = TRUE
  LegacyMutableRetry = FALSE
  LegacyTerminalAsGranted = FALSE
