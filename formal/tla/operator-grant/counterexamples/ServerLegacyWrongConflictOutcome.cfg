\* REC-I4-F1 — Expected-counterexample configuration.
\*
\* Legacy defect: a different command (different Attempt/payload) on the same
\* operationId returns idempotent_replay instead of idempotency_conflict
\* (LegacyWrongConflictOutcome).
\*
\* Expected: DifferentCommandReturnsIdempotencyConflict is violated.
\*   A transaction with a different command gets replay/granted outcome.

SPECIFICATION Spec

INVARIANT DifferentCommandReturnsIdempotencyConflict

CONSTANTS
  Attempts = {A1, A2}
  Exams = {E1, E2}
  Txs = {T1, T2}
  Operations = {Op1}
  Payloads = {P1, P2}
  LegacyDuplicateEffect = FALSE
  LegacyPartialCommit = FALSE
  LegacyWrongConflictOutcome = TRUE
  LegacyTerminalGrant = FALSE
