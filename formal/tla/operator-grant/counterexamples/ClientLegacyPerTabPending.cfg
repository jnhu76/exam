\* REC-I4-F1 — Expected-counterexample configuration.
\*
\* Legacy defect: each tab uses its own sessionStorage/tab-local pending
\* authority instead of a shared cross-tab authority (LegacyPerTabPending).
\*
\* Expected: AtMostOneUnresolvedCommandPerWorkflow is violated.
\*   Two tabs each create and submit different commands because neither
\*   sees the other's pending command.

SPECIFICATION Spec

INVARIANT AtMostOneUnresolvedCommandPerWorkflow

CONSTANTS
  Tabs = {Tab1, Tab2}
  CmdIds = {C1, C2}
  Ops = {O1, O2}
  Payloads = {P1, P2}
  C1 = C1
  C2 = C2
  LegacyPerTabPending = TRUE
  LegacyNewIdentityAfterLoss = FALSE
  LegacyMutableRetry = FALSE
  LegacyTerminalAsGranted = FALSE
