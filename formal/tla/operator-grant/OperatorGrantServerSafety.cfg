\* REC-I4-F1 — Operator Grant Server Safety configuration.
\* Exhaustive BFS over the server-side idempotency/concurrency protocol.
\* All legacy flags FALSE — target semantics only.
\*
\* Run with:
\*   TLA2TOOLS_JAR=/path/to/tla2tools.jar pnpm formal:operator-grant:server

SPECIFICATION Spec

INVARIANT ServerTypeOK
INVARIANT AtMostOneLedgerPerOperation
INVARIANT AtMostOneDeadlineEffectPerOperation
INVARIANT LedgerAndDeadlineCommitAtomically
INVARIANT ConflictLoserDeadlineUnchanged
INVARIANT ReplayReturnsCommittedFact
INVARIANT DifferentCommandReturnsIdempotencyConflict
INVARIANT TerminalAttemptNeverGranted
INVARIANT RetryDoesNotApplyAgain

CONSTANTS
  Attempts = {A1, A2}
  Exams = {E1, E2}
  Txs = {T1, T2}
  Operations = {Op1}
  Payloads = {P1, P2}
  LegacyDuplicateEffect = FALSE
  LegacyPartialCommit = FALSE
  LegacyWrongConflictOutcome = FALSE
  LegacyTerminalGrant = FALSE
