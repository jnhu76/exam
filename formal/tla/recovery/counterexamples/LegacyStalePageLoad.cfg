\* REC-F1 — Expected-counterexample configuration.
\*
\* Legacy defect: a late page-load response from an older route generation
\* is allowed to overwrite the current route's snapshot
\* (LegacyApplyStalePageLoad).
\*
\* Expected: NoStalePageLoadApply is violated.
\*   ApplyAuthoritativeReload's IsCurrent(d) gate is bypassed, so a stale
\*   delivery can become the page's applied snapshot.

SPECIFICATION RouteSwitchSpec

INVARIANT NoStalePageLoadApply

CONSTANTS
  Attempts = {A, B}
  Generations = {g0, g1}
  RequestIds = {r0, r1, r2}
  AnswerValues = {ans0, ans1}
  LegacyWrongAttemptCapability = FALSE
  LegacyGlobalInFlight = FALSE
  LegacyApplyStalePageLoad = TRUE
  LegacySkipReloadAfterPostFailure = FALSE
