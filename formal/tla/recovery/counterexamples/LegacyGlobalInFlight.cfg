\* REC-F1 — Expected-counterexample configuration.
\*
\* Legacy defect: the in-flight restore guard is a single global boolean
\* (LegacyGlobalInFlight), so an in-flight restore for attempt A blocks a
\* legal restore for attempt B.
\*
\* Expected: NoCrossAttemptRestoreBlocking is violated.
\*   The enabledness invariant checks that when all per-route base conditions
\*   hold, StartRestore is ENABLED. With the global guard, A's in-flight
\*   restore makes ~AnyRestoreInFlight FALSE, so StartRestore is disabled
\*   for B even though B's own route has no in-flight restore. TLC finds the
\*   violating state directly (no fairness or liveness needed).

SPECIFICATION RouteSwitchSpec

INVARIANT NoCrossAttemptRestoreBlocking

CONSTANTS
  Attempts = {A, B}
  Generations = {g0, g1}
  RequestIds = {r0, r1, r2}
  AnswerValues = {ans0, ans1}
  LegacyWrongAttemptCapability = FALSE
  LegacyGlobalInFlight = TRUE
  LegacyApplyStalePageLoad = FALSE
  LegacySkipReloadAfterPostFailure = FALSE
