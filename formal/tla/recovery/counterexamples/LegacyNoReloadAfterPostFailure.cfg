\* REC-F1 — Expected-counterexample configuration.
\*
\* Legacy defect: after a POST restore failure (response lost / ambiguous),
\* the client skips the authoritative GET and lets the POST outcome select
\* page state directly (LegacySkipReloadAfterPostFailure).
\*
\* Expected: PostOutcomeIsNotPageAuthority is violated.
\*   StartAuthoritativeReload is skipped, so the page can reach an
\*   editable/terminal state without a current-generation authoritative
\*   GET snapshot applied.

SPECIFICATION CoreSpec

INVARIANT PostOutcomeIsNotPageAuthority

CONSTANTS
  Attempts = {A, B}
  Generations = {g0, g1}
  RequestIds = {r0, r1, r2}
  AnswerValues = {ans0, ans1}
  LegacyWrongAttemptCapability = FALSE
  LegacyGlobalInFlight = FALSE
  LegacyApplyStalePageLoad = FALSE
  LegacySkipReloadAfterPostFailure = TRUE
