\* REC-F1 — Expected-counterexample configuration.
\*
\* Legacy defect: a restore command for attempt B is initiated using a
\* snapshot/capability belonging to attempt A (LegacyWrongAttemptCapability).
\*
\* Expected: NoWrongAttemptRestore is violated.
\*   The StartRestore action's capability gate is bypassed, so a restore
\*   request can be created with snapshotAttempt # attemptId.

SPECIFICATION RouteSwitchSpec

INVARIANT NoWrongAttemptRestore

CONSTANTS
  Attempts = {A, B}
  Generations = {g0, g1}
  RequestIds = {r0, r1, r2}
  AnswerValues = {ans0, ans1}
  LegacyWrongAttemptCapability = TRUE
  LegacyGlobalInFlight = FALSE
  LegacyApplyStalePageLoad = FALSE
  LegacySkipReloadAfterPostFailure = FALSE
