\* REC-F1 — ROUTE-SWITCH SAFETY configuration.
\* Includes NavigateTo so the cross-attempt race is in the reachable state
\* graph. Excludes loss / deadline / grade (combinatorially explosive against
\* route changes; covered by CoreSafety and SubmissionSafety).
\*
\* Run with:
\*   TLA2TOOLS_JAR=/path/to/tla2tools.jar pnpm formal:recovery:safety:route

SPECIFICATION RouteSwitchSpec

INVARIANT TypeOK
INVARIANT NoWrongAttemptRestore
INVARIANT NoStalePageLoadApply
INVARIANT NoStaleRestoreApply
INVARIANT EditableRequiresCurrentAuthoritativeSnapshot
INVARIANT PostOutcomeIsNotPageAuthority
INVARIANT NoCrossAttemptRestoreBlocking

PROPERTY TerminalNeverResurrects
PROPERTY SubmittedSnapshotImmutable
PROPERTY ServerVersionNeverDecreases

CONSTANTS
  Attempts = {A, B}
  Generations = {g0, g1}
  RequestIds = {r0, r1, r2}
  AnswerValues = {ans0, ans1}
  LegacyWrongAttemptCapability = FALSE
  LegacyGlobalInFlight = FALSE
  LegacyApplyStalePageLoad = FALSE
  LegacySkipReloadAfterPostFailure = FALSE
