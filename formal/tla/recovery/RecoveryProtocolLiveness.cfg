\* REC-F1 — LIVENESS configuration for RecoveryProtocol.
\*
\* Checks the temporal property under explicit weak fairness on the actions
\* the liveness argument relies on. Safety invariants are also re-checked
\* here so a liveness run cannot silently regress a safety property.
\*
\* Use ONE TLC worker for liveness unless the pinned tool version documents
\* a verified multi-worker liveness configuration.
\*
\* Run with:
\*   TLA2TOOLS_JAR=/path/to/tla2tools.jar pnpm formal:recovery:liveness

SPECIFICATION FairSpec

INVARIANT TypeOK
INVARIANT NoWrongAttemptRestore
INVARIANT NoStaleRestoreApply
INVARIANT EditableRequiresCurrentAuthoritativeSnapshot
INVARIANT TerminalNeverResurrects

PROPERTY CurrentResumableAttemptEventuallyProgresses

\* Same finite bounds as the safety configuration. NetOutcomes is defined
\* in the module (see safety cfg comment for the rationale).
CONSTANTS
  Attempts = {A, B}
  Generations = {g0, g1}
  RequestIds = {r0, r1, r2}
  AnswerValues = {ans0, ans1}
  LegacyWrongAttemptCapability = FALSE
  LegacyGlobalInFlight = FALSE
  LegacyApplyStalePageLoad = FALSE
  LegacySkipReloadAfterPostFailure = FALSE
