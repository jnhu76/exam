\* REC-F1 — CORE SAFETY configuration (single-route restore lifecycle).
\* No NavigateTo. Covers: route-bound restore authority, stale-apply
\* isolation, editable-requires-GET, POST-is-not-authority, terminal
\* absorbing, submitted-snapshot immutability, version monotonicity.
\*
\* Run with:
\*   TLA2TOOLS_JAR=/path/to/tla2tools.jar pnpm formal:recovery:safety

SPECIFICATION CoreSpec

INVARIANT TypeOK
INVARIANT NoWrongAttemptRestore
INVARIANT NoStalePageLoadApply
INVARIANT NoStaleRestoreApply
INVARIANT EditableRequiresCurrentAuthoritativeSnapshot
INVARIANT PostOutcomeIsNotPageAuthority

PROPERTY TerminalNeverResurrects
PROPERTY SubmittedSnapshotImmutable
PROPERTY ServerVersionNeverDecreases
PROPERTY TimeGrantNeverDecreases

CONSTANTS
  Attempts = {A, B}
  Generations = {g0, g1}
  RequestIds = {r0, r1, r2}
  AnswerValues = {ans0, ans1}
  LegacyWrongAttemptCapability = FALSE
  LegacyGlobalInFlight = FALSE
  LegacyApplyStalePageLoad = FALSE
  LegacySkipReloadAfterPostFailure = FALSE
