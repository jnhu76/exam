\* REC-F1 — Target SAFETY configuration for RecoveryProtocol.
\*
\* All legacy-defect switches are FALSE. The model must check exhaustively
\* (TLC BFS) with no invariant violation and no unexpected deadlock.
\*
\* Run with:
\*   TLA2TOOLS_JAR=/path/to/tla2tools.jar pnpm formal:recovery:safety

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT NoWrongAttemptRestore
INVARIANT NoStalePageLoadApply
INVARIANT NoStaleRestoreApply
INVARIANT EditableRequiresCurrentAuthoritativeSnapshot
INVARIANT TerminalNeverResurrects
INVARIANT SubmittedSnapshotImmutable
INVARIANT ServerVersionNeverDecreases
INVARIANT NoCrossAttemptRestoreBlocking
INVARIANT RestoreDoesNotDirectlyChangeDeadline
INVARIANT PostOutcomeIsNotPageAuthority

\* Finite model bounds — deliberately small for exhaustive BFS.
\* NetOutcomes is defined IN THE MODULE (not assigned here) so its string
\* elements match the literals used in the action bodies — a cfg-assigned
\* set of model values would not equal those literals and would break the
\* Delivery record type check.
CONSTANTS
  Attempts = {A, B}
  Generations = {g0, g1}
  RequestIds = {r0, r1, r2}
  AnswerValues = {ans0, ans1}
  LegacyWrongAttemptCapability = FALSE
  LegacyGlobalInFlight = FALSE
  LegacyApplyStalePageLoad = FALSE
  LegacySkipReloadAfterPostFailure = FALSE
