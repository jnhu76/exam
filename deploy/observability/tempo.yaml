# Grafana Tempo — Exam opt-in observability profile (#964 W6).
# Image: grafana/tempo:3.1.1 (monolithic `target=all` mode with local
# storage — no Kafka, no object storage for the LAN profile; Tempo 3.x
# removed the 2.x `compactor`/`overrides.defaults` blocks this simply).
#
# Traces arrive via the collector's otlp_http exporter →
# http://tempo:4318 (OTLP/HTTP ingestion; Tempo appends /v1/traces).
#
# Retention is set as a COMMAND FLAG in the compose file
# (-backend-scheduler.provider.work.compaction.block-retention=336h =
# 14 days): in Tempo 3.1.1 that knob is flag-addressable but not part of
# the YAML schema (probe-measured; see
# docs/operations/technical-telemetry.md §Retention).

server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
