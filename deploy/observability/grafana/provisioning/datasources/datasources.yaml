# Grafana datasource provisioning — Exam opt-in observability profile
# (#964 W6). Image: grafana/grafana:13.3.1. All three datasources are
# network-internal (service names on exam-net); access to the Grafana UI
# is the host operator's ingress decision (compose publishes one
# host port, bound to loopback by default).
apiVersion: 1

datasources:
  - name: Tempo
    # Fixed uid: the Loki derived field below links trace_id to it, and an
    # auto-generated uid (P214B5B846CF3925F) would break that link.
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: true
    editable: false
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: false
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    # Trace correlation: a Loki log line carrying trace_id links to Tempo.
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"(\w+)"'
          datasourceUid: tempo
