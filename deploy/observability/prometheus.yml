# Prometheus — Exam opt-in observability profile (#964 W6).
# Image: prom/prometheus:v3.16.0.
#
# Scrapes the collector's prometheus exposition endpoint
# (otelcol:8889) — the single metric path. OTLP metrics from the app land
# in the collector, which exposes them here; Prometheus itself never
# receives OTLP directly and needs no remote-write.
#
# Retention: 14 days (--storage.tsdb.retention.time flag in the compose
# file; horizon is an operator decision — see
# docs/operations/technical-telemetry.md §Retention).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otelcol-exam-metrics
    static_configs:
      - targets: ["otelcol:8889"]
