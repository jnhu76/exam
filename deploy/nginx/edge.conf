# Exam production edge reverse proxy (#585).
# Runtime-mounted read-only by docker-compose.yml as
# /etc/nginx/conf.d/default.conf in the `nginx` service — the ONLY public
# production ingress: host :80 -> web:4173 (static SPA) / app:3000 (API).
# Development/test never touches this file (they use 4173/3000 directly).

# INVARIANT: upstream names resolve at REQUEST time through Docker's
# embedded DNS (127.0.0.11), never once at nginx startup. A static
# `upstream` block caches a container IP forever, so recreating app/web
# (every upgrade) would leave the edge 502-ing against a stale address
# until nginx itself is recreated. valid=10s bounds failover latency and
# DNS query volume.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # With HTTPS enabled, replace this server's routing with:
    # return 301 https://$host$request_uri;

    # The /api prefix reaches Fastify unchanged (no rewrites). proxy_pass
    # carries a variable, so the original request URI is forwarded as-is.
    location /api/ {
        set $upstream_api app:3000;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # INVARIANT: REPLACE, never append ($proxy_add_x_forwarded_for).
        # This edge is the first and only proxy — a client-supplied XFF
        # chain that got appended would be INSIDE the app's trusted-proxy
        # walk (#546), letting any client forge its audit/rate-limit
        # identity. The real client address is exactly $remote_addr here.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $upstream_web web:4173;
        proxy_pass http://$upstream_web;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

