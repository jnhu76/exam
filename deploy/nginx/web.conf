# Exam production Web runtime (#585): the SOLE public ingress and static
# SPA server. Baked into the web-runner image (Dockerfile) as
# /etc/nginx/conf.d/default.conf; serves apps/web/dist with SPA deep-link
# fallback and routes /api/** to app:3000. Not `vite preview`.

# INVARIANT: the API upstream resolves at REQUEST time through Docker's
# embedded DNS (127.0.0.11), never once at nginx startup. A static
# `upstream` block caches a container IP forever, so recreating app
# (every upgrade) would leave the edge 502-ing against a stale address
# until nginx itself is recreated. valid=10s bounds failover latency and
# DNS query volume.
resolver 127.0.0.11 valid=10s ipv6=off;

# #925 access-log privacy: this explicit format replaces nginx's default
# `combined`, whose $request persists the full request line including the
# query string — tokens, reset links and invite tokens are client-
# controllable there, and the PATH itself can carry secrets. Banned from
# this format forever: $request, $request_uri, raw $uri, $http_referer,
# $http_cookie, $http_authorization.
#
# Fields are server-observed facts only: client address, method, a FIXED
# prefix-level route placeholder (this edge has no trusted per-route
# template — granular correlation lives in the app's pino lines under the
# same reqid), status, bytes, timings, upstream diagnostics, and the
# X-Request-Id the Fastify upstream stamped on the response.
#
# IDENTITY BOUNDARY: $sent_http_x_request_id is the ADR-025 UUIDv4 the API
# generated (the app ignores inbound request-id headers, so no client
# value can survive into it). It is NOT nginx's own $request_id, and it is
# "-" for nginx-served static responses, errors answered by nginx itself,
# or app builds predating the response header.
#
# #925 error_log boundary: nginx core quotes the FULL request line (with
# query) in error-level messages — e.g. upstream resolution failures while
# the app container restarts ("request: \"GET /api/...?token=... HTTP/1.1\""),
# verified live. This vhost therefore keeps only crit+ in error_log; the
# access log's status/up/rt fields already carry the operational story for
# 5xx proxy failures. Flip to `warn` only with an Owner decision accepting
# the query-secret exposure (record it in #925).
#
log_format exam_privacy '$remote_addr - [$time_local] "$request_method $exam_route" '
                        '$status $body_bytes_sent rt=$request_time '
                        'up=$upstream_status/$upstream_response_time '
                        'reqid=$sent_http_x_request_id';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Stock image symlinks these paths to stdout/stderr — container log
    # collection is unchanged; only the format/level are now explicit and
    # secret-free.
    access_log /var/log/nginx/access.log exam_privacy;
    error_log /var/log/nginx/error.log crit;

    # With HTTPS enabled, replace this server's routing with:
    # return 301 https://$host$request_uri;

    # The /api prefix reaches Fastify unchanged (no rewrites). proxy_pass
    # carries a variable, so the original request URI is forwarded as-is.
    location /api/ {
        # Fixed prefix placeholder — never the proxied path/query (#925).
        set $exam_route "/api";
        set $upstream_api app:3000;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # INVARIANT: overwrite, never pass through. With the app's
        # trusted-proxy walk enabled, X-Forwarded-* headers decide derived
        # request identity (host/protocol/ip); a client-supplied value that
        # survived the edge would be trusted input. Same overwrite contract
        # the runbook mandates for external proxies.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # INVARIANT: REPLACE, never append ($proxy_add_x_forwarded_for).
        # This edge is the first and only proxy — a client-supplied XFF
        # chain that got appended would be INSIDE the app's trusted-proxy
        # walk (#546), letting any client forge its audit/rate-limit
        # identity. The real client address is exactly $remote_addr here.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static SPA with deep-link fallback.
    location / {
        # Fixed placeholder — deep links (which may carry path secrets)
        # never enter the access log (#925).
        set $exam_route "/spa";
        try_files $uri $uri/ /index.html;
    }
}

