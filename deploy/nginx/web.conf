# Exam production static Web server (#585).
# Baked into the web-runner image (Dockerfile) as
# /etc/nginx/conf.d/default.conf; serves apps/web/dist on :4173 with SPA
# deep-link fallback. Not `vite preview`.

server {
    listen 4173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
