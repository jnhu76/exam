# Exam production Web runtime (#585): the SOLE public ingress and static
# SPA server. Baked into the web-runner image (Dockerfile) as
# /etc/nginx/conf.d/default.conf; serves apps/web/dist with SPA deep-link
# fallback and routes /api/** to app:3000. Not `vite preview`.

# INVARIANT: the API upstream resolves at REQUEST time through Docker's
# embedded DNS (127.0.0.11), never once at nginx startup. A static
# `upstream` block caches a container IP forever, so recreating app
# (every upgrade) would leave the edge 502-ing against a stale address
# until nginx itself is recreated. valid=10s bounds failover latency and
# DNS query volume.
resolver 127.0.0.11 valid=10s ipv6=off;

# #925 access-log privacy: this explicit format replaces nginx's default
# `combined`, whose $request persists the full request line including the
# query string — tokens, reset links and invite tokens are client-
# controllable there, and the PATH itself can carry secrets. Banned from
# this format forever: $request, $request_uri, raw $uri, $http_referer,
# $http_cookie, $http_authorization.
#
# Fields are server-observed facts only: client address, method, a FIXED
# prefix-level route placeholder (this edge has no trusted per-route
# template — granular correlation lives in the app's pino lines under the
# same reqid), status, bytes, timings, upstream diagnostics, and the
# X-Request-Id the Fastify upstream stamped on the response.
#
# IDENTITY BOUNDARY: $sent_http_x_request_id is the ADR-025 UUIDv4 the API
# generated (the app ignores inbound request-id headers, so no client
# value can survive into it). It is NOT nginx's own $request_id, and it is
# "-" for nginx-served static responses, errors answered by nginx itself,
# or app builds predating the response header.
#
# #925 error_log / Owner Decision A: nginx core quotes the FULL request
# line (with query) in error-level messages — e.g. upstream resolution
# failures while the app container restarts
# ("request: \"GET /api/...?token=... HTTP/1.1\""), verified live. For this
# local, self-managed deployment the Owner ACCEPTED that raw-URL exposure
# to keep nginx's native error-level fault diagnostics (upstream failures,
# resolution errors); `crit` is banned — it suppresses normal fault
# diagnosis. This acceptance is a SEPARATE claim from the access-log
# privacy format above: never merge the two into one "no raw URLs in
# nginx logs" statement. Raise to `warn` only with a new Owner decision
# recorded in #925 — fault injection showed `warn` adds no
# upstream-failure diagnostic value but DOES leak malformed request
# lines via "using uninitialized variable" warnings. Keep the existing
# rotation and do not expose this file to candidates or non-admin
# operators without redaction.
#
log_format exam_privacy '$remote_addr - [$time_local] "$request_method $exam_route" '
                        '$status $body_bytes_sent rt=$request_time '
                        'up=$upstream_status/$upstream_response_time '
                        'reqid=$sent_http_x_request_id';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Stock image symlinks these paths to stdout/stderr — container log
    # collection is unchanged. The access log is secret-free; the error
    # log is the Decision-A accepted-risk native diagnostic stream.
    access_log /var/log/nginx/access.log exam_privacy;
    error_log /var/log/nginx/error.log error;

    location = /healthz { return 200; }
    location / { return 301 https://$host$request_uri; }


}

server {
    listen 443 ssl;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # #925: the privacy format/level MUST be carried into an activated
    # HTTPS vhost too — without these lines the 443 server inherits the
    # http-level combined format ($request with query), silently
    # re-opening the token-in-query leak this file closes. The
    # error_log level stays the Decision-A `error` (native diagnostics,
    # raw-request-line risk accepted) — pinned by nginxWebConf.test.ts
    # over this block.
    access_log /var/log/nginx/access.log exam_privacy;
    error_log /var/log/nginx/error.log error;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location /api/ {
        # Fixed prefix placeholder — never the proxied path/query (#925).
        set $exam_route "/api";
        set $upstream_api app:3000;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        # Fixed placeholder — deep links (which may carry path secrets)
        # never enter the access log (#925).
        set $exam_route "/spa";
        try_files $uri $uri/ /index.html;
    }
}
